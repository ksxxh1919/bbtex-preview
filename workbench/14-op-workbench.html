<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232CA01C'/%3E%3C/svg%3E">
<title>工作台 · 状态维护 · BBTEX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
:root{
  --font:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --font-id:"Inter","Noto Sans SC",sans-serif;
  --side:360px;
  --top-h:55px;
  --sp1:8px; --sp2:13px; --sp3:21px; --sp4:34px;
  --r:8px; --r-lg:13px;
  --qb-nav:#2C3038; --qb-nav-hi:#363B45; --qb-nav-active:#3D4450;
  --qb-nav-text:#C8CDD6; --qb-nav-mute:#C8CDD6; --qb-green:#2CA01C;
  --accent:#2E7BE5; --accent-text:#1A5FB4; --accent-tint:#E8F1FC;
  --bg:#F0F2F5; --surface:#fff; --sunken:#F4F5F7;
  --line:#E3E6EB; --line-soft:#ECEEF2;
  --t1:#1A1D23; --t2:#3A3F4A; --t3:#5C6370; --t4:#5C6370;
  --ok:#2CA01C; --ok-bg:#E8F6E8;
  --warn:#B86E00; --warn-bg:#FFF8EB;
  --danger:#C62828; --danger-bg:#FDEDED;
  --sh-card:0 0 0 1px rgba(26,29,35,.06),0 1px 2px rgba(26,29,35,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100vh;min-width:1180px}
.rail{background:var(--qb-nav);color:var(--qb-nav-text);display:flex;flex-direction:column;height:100vh;min-width:0;padding:var(--sp2) var(--sp1) var(--sp1)}
.rail-top{flex:none;padding:2px var(--sp1) var(--sp2)}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:28px;height:28px;border-radius:var(--r);background:var(--qb-green);color:#1A1D23;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.brand b{display:block;font-size:13px;font-weight:650;line-height:18px;color:#fff}
.brand small{display:block;font-size:13px;color:var(--qb-nav-mute);line-height:18px}
.rail-mid{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;padding:0 4px}
.ni,a.ni{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:var(--r);color:var(--qb-nav-text);font-size:14px;position:relative;margin:1px 0;user-select:none;width:100%;border:0;background:transparent;text-align:left;text-decoration:none}
.ni:hover{background:var(--qb-nav-hi);color:#fff}
.ni.on{background:var(--qb-nav-active);color:#fff;font-weight:600}
.ni.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--qb-green)}
.ni .badge{margin-left:auto;font-size:13px;font-weight:650;background:rgba(255,255,255,.12);color:#E8EAEE;padding:0 6px;height:18px;line-height:18px;border-radius:9px;font-variant-numeric:tabular-nums}
.ni.quiet{color:var(--qb-nav-mute);font-size:13px}
.grp{font-size:13px;font-weight:650;color:var(--qb-nav-mute);letter-spacing:.04em;padding:var(--sp3) 12px var(--sp1)}
.sec-h{display:flex;align-items:center;gap:8px;width:calc(100% - 8px);height:36px;margin:2px 4px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:#C8CDD6;font:inherit;font-size:13px;font-weight:650;text-align:left}
.sec-h:hover{background:rgba(255,255,255,.05);color:#fff}
.sec-h .car{font-size:13px;width:14px;color:var(--qb-nav-mute);transition:transform .15s}
.sec-h.fold .car{transform:rotate(-90deg)}
.sec-h .gc{margin-left:auto;min-width:18px;height:18px;padding:0 6px;border-radius:9px;background:rgba(255,255,255,.1);color:#E8EAEE;font-size:13px;font-weight:650;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.sec-h.today{color:#fff}
.sec-h.done{color:#8FCB86}
.sec-h.done .gc{background:rgba(44,160,28,.28);color:#C8F0C0}
.q-body{display:none;padding:0 4px 4px}
.q-body.open{display:block}
.task{display:grid;grid-template-columns:18px minmax(0,1fr);column-gap:4px;align-items:start;width:100%;padding:6px 6px 6px 6px;border-bottom:1px solid rgba(255,255,255,.06);border-radius:6px;position:relative}
.task.on{background:rgba(255,255,255,.12)}
.task.on::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--qb-green)}
.cklab{min-width:24px;min-height:24px;display:inline-flex;align-items:center;justify-content:center}
.task .ck{width:16px;height:16px;accent-color:#7CB6FF}
.hit{display:grid;grid-template-columns:10px minmax(0,1fr) auto;column-gap:8px;align-items:start;width:100%;border:0;background:transparent;color:#E8EAEE;text-align:left;padding:2px 2px;min-width:0}
.hit:hover{color:#fff}
.task .dot{width:8px;height:8px;border-radius:50%;background:#C8CDD6;margin-top:5px}
.task .dot.hot{background:var(--danger);border-radius:2px}
.task .dot.due{background:#C47A00}
.task .dot.ok{background:var(--qb-green)}
.task .dot.wait{background:#7A8699}
.task .mid{min-width:0;display:flex;flex-direction:column;gap:2px}
.task .cid{font-family:var(--font-id);font-weight:650;font-size:13px;color:#F2F4F7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:18px}
.task .sub{font-size:14px;color:#C8CDD6;line-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .tag{font-size:13px;font-weight:650;height:22px;line-height:22px;padding:0 7px;border-radius:4px;background:rgba(255,255,255,.1);color:#E8EAEE;white-space:nowrap}
.task .tag.hot{background:rgba(198,40,40,.42);color:#FFD6D6}
.task .tag.due{background:rgba(196,122,0,.34);color:#FFE3B0}
.task .tag.ok{background:rgba(44,160,28,.28);color:#C8F0C0}
.task .tag.wait{background:rgba(255,255,255,.08);color:#C8CDD6}
.empty{padding:8px 12px 13px;font-size:13px;color:var(--qb-nav-mute)}
.nav-foot{flex:none;border-top:1px solid rgba(255,255,255,.08);margin-top:var(--sp1);padding-top:var(--sp1);position:relative;z-index:6}
.role-anchor{position:relative}
.role-pop{display:none;position:absolute;left:8px;right:8px;bottom:100%;margin-bottom:4px;background:#fff;color:var(--t1);border-radius:var(--r-lg);box-shadow:0 0 0 1px rgba(26,29,35,.08),0 8px 24px -6px rgba(26,29,35,.18);padding:8px;z-index:8}
.role-pop.open{display:block}
.role-pop .rh{font-size:13px;color:var(--t4);padding:4px 8px 8px}
.role-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:0;background:transparent;border-radius:8px;padding:8px;text-align:left}
.role-opt:hover{background:var(--sunken)}
.role-opt.on{background:var(--accent-tint)}
.role-opt b{font-size:14px;font-weight:650;color:var(--t1)}
.role-opt span{font-size:13px;color:var(--t3)}
.me{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:inherit;padding:8px;text-align:left;border-radius:8px}
.me:hover{background:rgba(255,255,255,.05)}
.me .av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
.me b{display:block;font-size:14px;line-height:18px;color:#E8EAEE}
.me small{display:block;font-size:13px;color:var(--qb-nav-mute)}
.me .chev{margin-left:auto;color:var(--qb-nav-mute);font-size:13px}
.main{min-width:0;display:flex;flex-direction:column;height:100vh;background:var(--bg)}
.top{height:var(--top-h);flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:var(--sp2);padding:0 var(--sp4);min-width:0}
.who{flex:none;min-width:0}
.who b{display:block;font-size:14px;font-weight:650;line-height:18px}
.who small{display:block;font-size:13px;color:var(--t4);line-height:16px}
.top-focus{flex:1;min-width:0;border:0;background:transparent;text-align:left;font-size:14px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0}
.top-focus:hover{color:var(--accent-text)}
.top-focus.clear{color:var(--ok)}
.ringbox{flex:none;display:flex;align-items:center;gap:8px}
.ringbox .rl{font-size:13px;color:var(--t3);line-height:16px}
.ringbox .rl b{display:block;font-size:14px;color:var(--t1);font-variant-numeric:tabular-nums;font-weight:650}
.ringbox.clear .rl b{color:var(--ok)}
.cols{flex:1;min-height:0;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:13px;padding:var(--sp3) var(--sp4)}
.hero,.side{min-width:0;min-height:0;overflow-x:hidden;overflow-y:auto;overflow-anchor:none}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-card);padding:var(--sp3)}
.kicker{font-size:13px;font-weight:650;color:var(--t4);margin-bottom:8px}
.h-id{font-family:var(--font-id);font-size:22px;font-weight:650;letter-spacing:.01em;line-height:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:13px;font-weight:650;background:var(--sunken);color:var(--t2)}
.chip.hot{background:var(--danger-bg);color:var(--danger)}
.chip.due{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.meta{margin-top:8px;font-size:13px;color:var(--t3);line-height:20px}
.action{margin-top:8px;font-size:16px;font-weight:650;line-height:24px}
.dots{display:flex;align-items:center;gap:8px;margin-top:13px}
.dots .row{display:flex;gap:5px;align-items:center}
.nd{width:8px;height:8px;border-radius:50%;background:#E3E6EB;flex:none}
.nd.d{background:var(--ok)}
.nd.c{width:10px;height:10px;background:var(--accent)}
.nd.fin{background:transparent;border:1.5px dashed #C5CDD8}
.dots .nm{font-size:13px;color:var(--t2);font-weight:600}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:13px}
.st{font-size:13px;color:var(--t4);background:var(--sunken);border-radius:4px;padding:2px 8px}
.st.d{background:var(--ok-bg);color:var(--ok);font-weight:650}
.st.c{background:var(--accent-tint);color:var(--accent-text);font-weight:650}
.arr{font-style:normal;color:var(--t4);font-size:13px}
.batch{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:13px;padding:10px 12px;border-radius:8px;background:var(--sunken);font-size:13px;color:var(--t2)}
.batch select,.batch input{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:#fff;font-size:14px;min-width:0}
.batch input{width:140px}
.secnav{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px;position:sticky;top:0;z-index:2;background:var(--surface);padding-bottom:8px}
.secnav button{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:650;color:var(--t2)}
.secnav button.on{background:var(--accent-tint);border-color:#C5D9F5;color:var(--accent-text)}
.secnav button .muted{font-weight:500;color:var(--t4)}
.block{margin-top:8px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.block.shut{display:none}
.block.own{border-color:#C5D9F5}
.block-h{display:flex;align-items:center;gap:8px;padding:10px 13px;background:var(--sunken);font-size:14px;font-weight:650}
.block.own .block-h{background:var(--accent-tint)}
.block-h .sum{margin-left:auto;font-size:13px;font-weight:500;color:var(--t3)}
.qbtns{display:flex;flex-wrap:wrap;gap:8px;padding:8px 13px 0}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:8px 13px 13px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fv{display:flex;flex-direction:column;gap:4px;min-width:0}
.fv.wide{grid-column:1/-1}
.fv .lab{font-size:14px;font-weight:600;color:var(--t3);line-height:1.4;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gate-tag,.next-tag{font-style:normal;font-weight:650;font-size:13px;color:var(--accent-text)}
.next-tag{background:var(--accent);color:#fff;border-radius:4px;padding:0 6px;line-height:20px}
.fv input,.fv select{height:34px;padding:0 10px;border-radius:6px;border:1px dashed var(--line);background:#fff;font-size:14px;width:100%;min-width:0;outline:none}
.fv.filled input,.fv.filled select{border-style:solid;border-color:#B7D7A8;background:#F6FBF6}
.fv.next input,.fv.next select{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,123,229,.15);background:#fff}
.fv input:focus,.fv select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,123,229,.12)}
.fv input:disabled,.fv select:disabled{background:var(--sunken);color:var(--t2);border-style:solid}
.file-row{display:flex;gap:8px;min-width:0}
.file-row input{flex:1}
.banner{margin:13px 13px 0;padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.45}
.banner.hot{background:var(--danger-bg);color:var(--danger)}
.banner.lock{background:var(--warn-bg);color:var(--warn)}
.gfoot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:13px;background:#FAFBFE;border-top:1px solid var(--line-soft)}
.gfoot .nx{flex:1;min-width:180px;font-size:13px;color:var(--t3);line-height:1.45}
.btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--t1);font-size:14px;font-weight:650}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--qb-green);border-color:var(--qb-green);color:#1A1D23}
.btn.primary:hover{background:#248A16;color:#1A1D23}
.btn.sm{height:34px;padding:0 10px}
.side{display:flex;flex-direction:column;gap:13px}
.side h3{font-size:13px;font-weight:650;color:var(--t4);margin-bottom:8px}
.ai{font-size:14px;color:var(--t2);line-height:1.55}
.ai b{color:var(--accent-text);font-weight:650}
.msg{display:flex;gap:8px;padding:8px 0;border-top:1px solid var(--line-soft)}
.msg:first-of-type{border-top:0;padding-top:0}
.msg .av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:650;display:flex;align-items:center;justify-content:center;flex:none}
.msg .tx{min-width:0;font-size:13px;color:var(--t2);line-height:1.5}
.msg .tx b{font-weight:650}
.msg .tm{color:var(--t4)}
.tools{display:flex;flex-direction:column;gap:8px}
.tool,a.tool{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;text-align:left;text-decoration:none;color:inherit}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:inherit}
.tool:hover{background:var(--accent-tint);border-color:#C5D9F5;color:var(--accent-text)}
.note{font-size:13px;color:var(--t4);line-height:1.5}
.toast{position:fixed;left:50%;bottom:21px;transform:translateX(-50%);background:#2C3038;color:#fff;font-size:14px;padding:10px 16px;border-radius:8px;z-index:40;max-width:min(560px,calc(100vw - 48px));display:none}
.toast.on{display:block}
.save-stamp{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;min-height:28px;margin:-8px -8px 8px;padding:6px 8px;background:#fff;font-size:14px;font-weight:650;color:var(--ok)}
.save-stamp.wait{color:var(--t3);font-weight:600}
.switch-note{margin:0 0 8px;padding:8px 10px;border-radius:8px;background:#FFF8EB;color:#5C4314;font-size:14px;line-height:1.45}
.field-err{font-size:14px;color:var(--danger);line-height:1.4;min-height:0}
.hist{border:0;background:transparent;color:var(--accent-text);font-size:14px;font-weight:650;padding:0 4px;min-height:24px}
.hist-pop{margin-top:4px;padding:8px;border-radius:8px;background:var(--sunken);font-size:14px;color:var(--t2);line-height:1.45}
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:100%;z-index:5;margin:2px 0 0;padding:4px;list-style:none;background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(26,29,35,.16);max-height:220px;overflow:auto}
.combo-list button{display:block;width:100%;text-align:left;border:0;background:transparent;min-height:28px;padding:4px 8px;border-radius:6px;font-size:14px}
.combo-list button.on,.combo-list button:hover{background:var(--accent-tint)}
.from-prev{font-style:normal;font-size:14px;font-weight:650;color:#5C4314;background:#FFF8EB;border-radius:4px;padding:0 6px}
.ai-sug{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--accent-text)}
.rare-sum{display:flex;align-items:center;width:100%;min-height:36px;border:0;background:var(--sunken);border-radius:8px;padding:0 10px;font-size:14px;font-weight:650;text-align:left}
.file-reject{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:14px}
.file-reject input{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:14px}
.cal{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:6px;background:#fff}
@media (max-width:1360px){
  .cols{grid-template-columns:minmax(0,1fr) 240px;padding:13px 21px}
}
.app *{font-size:14px !important}
.h-id,h1{font-size:22px !important}
.chip.ok,.chip.due{color:#0B5A09}
.chip.due,.chip.hot{color:#7A4A00}
.chip.hot{color:#8E1B1B}
button,.hit,.tool,.sec-h,.ni,.me,.role-opt,.cklab{min-height:24px;min-width:24px}
.me .av,.msg .av{background:#0B4FA8;color:#fff}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-top">
      <div class="brand"><div class="logo">B</div><div><b>BBTEX</b><small>工作台 · 演示</small></div></div>
    </div>
    <div class="rail-mid">
      <button type="button" class="ni on" id="navWb"><span>工作台</span><span class="badge" id="wbCount">0</span></button>
      <div id="nest"></div>
      <div class="grp">其他</div>
      <a class="ni quiet" href="../order-platform/13-order-mgmt-qb.html#/todo">订单平台</a>
      <button type="button" class="ni quiet" data-act="plat">提柜平台</button>
      <button type="button" class="ni quiet" data-act="plat">仓管平台</button>
      <button type="button" class="ni quiet" data-act="plat">派送平台</button>
    </div>
    <div class="nav-foot">
      <div class="role-anchor">
        <div class="role-pop" id="roleMenu">
          <div class="rh">换岗位，只看自己那段状态维护</div>
          <button type="button" class="role-opt" data-act="pick" data-role="isf"><b>ISF岗 · 陈静</b><span>填 ISF申报</span></button>
          <button type="button" class="role-opt" data-act="pick" data-role="tr"><b>转关提柜岗 · 赵磊</b><span>填 转关申报</span></button>
          <button type="button" class="role-opt" data-act="pick" data-role="wh"><b>仓库 · 刘洋</b><span>填 仓库操作</span></button>
          <button type="button" class="role-opt" data-act="pick" data-role="dl"><b>清关派送岗 · Maria</b><span>填 清关派送</span></button>
        </div>
        <button type="button" class="me" id="roleBtn" data-act="role-menu">
          <span class="av" id="roleAv">陈</span>
          <span><b id="roleName">陈静</b><small id="roleTitle">ISF岗 · 点这里换岗位</small></span>
          <span class="chev">▾</span>
        </button>
      </div>
    </div>
  </aside>

const VALS = {};
function seed(id){
  const cab = CABS[id];
  const v = {};
  let blank = false;
  FIELDS.forEach(f => {
    if (f.k === cab.empty) blank = true;
    v[f.k] = blank ? '' : f.demo;
  });
  v.mode = cab.mode || v.mode || '火车';
  if (!v.tmode) v.tmode = cab.mode || '火车';
  if (cab.lfd) v.lfd = cab.lfd;
  if (id==='TEST1122334') v.shortover = '少 3';
  if (id==='TEST8899001') v.box = '10/03 海关查验，还没放行';
  v.boxLines = v.boxLines || [];
  cab.passed = {};
  GATES.forEach(g => {
    if (g.train && cab.mode!=='火车') { cab.passed[g.id] = true; return; }
    const empty = g.keys.some(k => !String(v[k]||'').trim());
    if (!empty) cab.passed[g.id] = true;
  });
  return v;
}
function vals(id){
  if (!CABS[id]) return null;
  if (!VALS[id]) {
    VALS[id] = seed(id);
    const saved = wbStore()[id];
    if (saved && saved.values) {
      Object.assign(VALS[id], saved.values);
      const cab = CABS[id];
      cab.passed = {};
      GATES.forEach(g => {
        if (skipped(cab, g)) { cab.passed[g.id] = true; return; }
        if (!g.keys.some(k => !String(VALS[id][k]||'').trim())) cab.passed[g.id] = true;
      });
    }
  }
  return VALS[id];
}

function editable(cab){
  if (!cab) return false;
  const s = role().sec;
  if (s==='isf') return cab.node===1;
  if (s==='tr') return cab.node===3 || cab.node===4;
  if (s==='wh') return cab.node===5 || cab.node===6;
  if (s==='dl') return cab.node===7 || cab.node===8;
  return false;
}
function skipped(cab, g){ return g.train && cab && cab.mode!=='火车'; }
function nextGate(id){
  const cab = CABS[id];
  const v = vals(id);
  if (!cab || !v) return null;
  for (const g of GATES){
    if (skipped(cab, g)) continue;
    const empty = g.keys.filter(k => !String(v[k]||'').trim());
    if (empty.length) return {g, key:empty[0]};
  }
  return null;
}
function ownOpen(){
  state.secOpen = {isf:false, tr:false, wh:false, dl:false};
  state.secOpen[role().sec] = true;
}
function filledCount(id, sec){
  const v = vals(id);
  const list = FIELDS.filter(f => f.sec===sec);
  const n = list.filter(f => String(v[f.k]||'').trim()).length;
  return n+'/'+list.length;
}

function wbStore(){ try { return JSON.parse(localStorage.getItem(WB_KEY)) || {}; } catch(e){ return {}; } }
function wbWrite(s){ localStorage.setItem(WB_KEY, JSON.stringify(s)); }
function cabRec(id){
  const s = wbStore();
  if (!s[id]) s[id] = { values:{}, savedAt:'', history:{}, confirmed:{}, confirmedInit:false, fail:{} };
  if (!s[id].history) s[id].history = {};
  if (!s[id].fail) s[id].fail = {};
  if (!s[id].confirmed) s[id].confirmed = {};
  return { s, rec: s[id] };
}
function hms(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
function fieldBy(k){ return FIELDS.find(f => f.k===k); }
function queueUids(){
  const r = role();
  const out = [];
  BUCKETS.forEach(k => (r[k]||[]).forEach(t => { if (CABS[t.id]) out.push(t.uid); }));
  return out;
}
function normDate(raw){
  const s = String(raw??'').trim();
  if (!/^\d{4}$/.test(s)) return { kind:'keep', v:s };
  const mo = Number(s.slice(0,2)), da = Number(s.slice(2));
  if (mo<1 || mo>12 || da<1 || da>31) return { kind:'bad', v:s };
  return { kind:'ok', v: String(mo).padStart(2,'0')+'/'+String(da).padStart(2,'0') };
}
function ensureConfirmed(id){
  const { s, rec } = cabRec(id);
  if (rec.confirmedInit) return rec;
  FIELDS.forEach(f => { if (f.g) rec.confirmed[f.k] = String(vals(id)[f.k]||''); });
  Object.keys(DEFAULTS).forEach(k => { if (!String(vals(id)[k]||'').trim()) vals(id)[k] = DEFAULTS[k]; });
  rec.confirmedInit = true;
  s[id] = rec;
  wbWrite(s);
  return rec;
}
function setStamp(text, waiting){

}
function showFieldErr(key, msg){

  if (!er){ er = document.createElement('div'); er.className = 'field-err'; fv.appendChild(er); }
  er.textContent = msg || '';

  if (msg && input) input.focus({ preventScroll:true });
}
function clearFieldErr(key){
  const er = document.querySelector('.fv[data-k="'+key+'"] .field-err');
  if (er) er.textContent = '';
}
function showFail(cabId, key){
  const { s, rec } = cabRec(cabId);
  rec.fail[key] = true;
  s[cabId] = rec;
  wbWrite(s);
  if (!current() || current().id!==cabId) return;
  showFieldErr(key, '没存上，字还在。');
  const fv = document.querySelector('.fv[data-k="'+key+'"]');
  if (fv && !fv.querySelector('[data-act="retry"]')){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn sm';
    b.dataset.act = 'retry';
    b.dataset.k = key;
    b.textContent = '重试';
    fv.appendChild(b);
  }
  const rec2 = wbStore()[cabId];
  setStamp(rec2 && rec2.savedAt ? ('已保存 '+rec2.savedAt) : '未保存', !rec2 || !rec2.savedAt);
}
function commit(cabId, key, value, how){
  const live = draft[cabId] && draft[cabId][key] !== undefined ? draft[cabId][key] : value;
  if (live !== value) return;
  if ((window.__bbtex && window.__bbtex.failNext) || window.__bbtexFailNext){
    if (window.__bbtex) window.__bbtex.failNext = false;
    window.__bbtexFailNext = false;
    showFail(cabId, key);
    return;
  }
  const { s, rec } = cabRec(cabId);
  const prev = rec.values[key] != null ? rec.values[key] : '';
  rec.values[key] = value;
  vals(cabId)[key] = value;
  const time = hms();
  rec.savedAt = time;
  if (!rec.history[key]) rec.history[key] = [];
  rec.history[key].push({ who: role().name, how: how, from: prev, to: value, time: time });
  if (rec.fail) delete rec.fail[key];
  s[cabId] = rec;
  wbWrite(s);
  if (current() && current().id===cabId){
    setStamp('已保存 '+time, false);
    clearFieldErr(key);
    const retry = document.querySelector('.fv[data-k="'+key+'"] [data-act="retry"]');
    if (retry) retry.remove();
  }
}
function schedule(cabId, key, value){
  const slot = cabId+'|'+key;
  clearTimeout(timers[slot]);
  timers[slot] = setTimeout(() => {
    timers[slot] = setTimeout(() => {
      delete timers[slot];
      const live = draft[cabId] && draft[cabId][key] !== undefined ? draft[cabId][key] : value;
      if (live !== value) return;
      commit(cabId, key, live, '自动保存');
    }, FLIGHT_MS);
  }, DEBOUNCE_MS);
}
function flushCab(cabId){
  Object.keys(timers).forEach(slot => {
    if (!slot.startsWith(cabId+'|')) return;
    clearTimeout(timers[slot]);
    delete timers[slot];
    const key = slot.slice(cabId.length+1);
    const live = draft[cabId] && draft[cabId][key] !== undefined ? draft[cabId][key] : String(vals(cabId)[key]||'');
    commit(cabId, key, live, '自动保存');
  });
}
function rememberEdit(cabId, key, value){
  if (!draft[cabId]) draft[cabId] = {};
  draft[cabId][key] = value;
  vals(cabId)[key] = value;
}
function gatePendingNote(t){
  if (!t || !CABS[t.id]) return '';
  const rec = wbStore()[t.id];
  if (!rec || !rec.confirmedInit) return '';
  const keys = FIELDS.filter(f => f.g).map(f => f.k);
  const hit = keys.filter(k => {
    const val = String((draft[t.id] && draft[t.id][k] !== undefined ? draft[t.id][k] : vals(t.id)[k]) || '');
    return val.trim() && String(rec.confirmed[k]||'') !== val;
  });
  if (!hit.length) return '';
  return t.id+' 的门闩已记下，还没确认推进。字还在这一柜。';
}
function canEditCab(cab, t){
  return !!(cab && t && editable(cab) && t.kind!=='none' && t.kind!=='ack');
}

function blocks(list, openFlag){
  let html = '';
  for (let i = 0; i < list.length; i++){
    const f = list[i], n = list[i+1];

      html += '<div class="pair" data-pair="1">'+fieldBlock(f, openFlag)+fieldBlock(n, openFlag)+'</div>';
      i++;

  }
  return html;

  el.textContent = text;
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('on'), 2600);
}
function finish(t, how){
  const r = role();
  for (const k of BUCKETS){
    const i = (r[k]||[]).findIndex(x => x.uid===t.uid);
    if (i>=0){ r[k].splice(i,1); break; }
  }
  t.bucket = 'done';
  t.tag = how==='ack' ? '已看' : '已推进';
  t.tagKind = 'ok'; t.dot = 'ok'; t.kind = 'none';
  t.line = '刚刚 · '+(t.doc||t.id);
  t.action = '刚刚处理完。';
  r.done.unshift(t);
  if (t.counts!==false && how!=='ack' && how!=='park') r.ringDone += 1;
  state.sel.delete(t.uid);
  const next = r.today[0] || r.done[0];
  state.uid = next ? next.uid : '';
  state.fold.done = false;
  ownOpen();
}
function applyNode(cab, g){
  if (g.id==='cd') { cab.node = 7; return; }
  if (g.id==='xd' && cab.mode==='火车') { cab.node = 7; return; }
  cab.node = g.next;
}
function tryAdvance(t, quiet){
  const cab = cabOf(t);
  const v = vals(t.id);
  if (!cab.passed) cab.passed = {};
  for (const g of GATES){
    if (g.train && cab.mode!=='火车') continue;
    if (cab.passed[g.id]) continue;
    const empty = g.keys.filter(k => !String(v[k]||'').trim());
    if (empty.length){
      const field = FIELDS.find(f => f.k===empty[0]);
      if (!quiet){
        if (!field || field.sec!==role().sec) toast('下一步不在你这段。');
        else if (cab.fh && field.lock) toast('请联系财务核实。');
        else toast('下一步还没填：'+field.l);
      }
      return false;
    }
    const field = FIELDS.find(f => f.k===g.keys[0]);
    if (!field || field.sec!==role().sec) { if (!quiet) toast('下一步不在你这段。'); return false; }
    if (cab.exc || (cab.insp && g.id==='pkdone')) {
      if (!quiet) toast('有异常或还在查验，这一格先记下，状态先不往前走。');
      return false;
    }
    cab.passed[g.id] = true;
    applyNode(cab, g);
    return true;
  }
  return false;
}
function focusStep(t){
  if (!t || !CABS[t.id] || state.pane==='unload') return;
  const v = vals(t.id);
  const order = OPEN[role().sec];
  const key = order.find(k => { const f = fieldBy(k); return f && (f.g || k==='consignee' || k==='term' || k==='devqty' || k==='decl') && !String(v[k]||'').trim(); }) || order.find(k => !String(v[k]||'').trim());
  const input = key && document.querySelector('#stepFields input[data-k="'+key+'"], #stepFields textarea[data-k="'+key+'"]');
  if (input && !input.disabled) input.focus({ preventScroll:true });
}
function render(){
  const hero = document.getElementById('hero');
  const y = hero.scrollTop;
  paintChrome();
  const form = document.getElementById('statusForm');
  const same = form && form.dataset.role===role().sec;
  if (!same){
    hero.innerHTML = current() ? formHTML() : '';
    state.rareOpen = false;
    state.pane = 'form';
  }
  paintValues(current());
  if (same) hero.scrollTop = y;
  else focusStep(current());
}
function switchTo(uid){
  const prev = current();
  if (prev && CABS[prev.id]) flushCab(prev.id);
  state.switchNote = gatePendingNote(prev);
  state.uid = uid;
  state.rejected = false;
  state.rejectOpen = false;
  const hero = document.getElementById('hero');
  const y = hero.scrollTop;
  paintChrome();
  const form = document.getElementById('statusForm');
  if (!form || form.dataset.role!==role().sec){
    hero.innerHTML = formHTML();
  }
  paintValues(current());
  hero.scrollTop = y;
  focusStep(current());
}
function confirmGate(key){
  const t = current();
  if (!t || !CABS[t.id]) return;
  flushCab(t.id);
  const value = String(vals(t.id)[key]||'').trim();
  if (!value){
    showFieldErr(key, '这一栏还空着，还不能推进。');
    return;
  }
  const f = fieldBy(key);
  if (f && DATE_KEYS.has(key)){
    const n = normDate(value);
    if (n.kind==='bad'){ showFieldErr(key, '日期不是有效的月/日。'); return; }
  }
  clearFieldErr(key);
  const before = CABS[t.id].node;
  const ok = tryAdvance(t, true);
  if (!ok || CABS[t.id].node===before && !CABS[t.id].passed[key]){
    showFieldErr(key, '这一栏已记下。状态还没往前，因为这一步还没齐，或有异常。');
    return;
  }
  const { s, rec } = cabRec(t.id);
  rec.confirmed[key] = value;
  s[t.id] = rec;
  wbWrite(s);
  const hist = rec.history[key] || [];
  hist.push({ who: role().name, how: '人工', from: value, to: value+' · 已确认', time: hms() });
  rec.history[key] = hist;
  wbWrite(s);
  const nodeNow = CABS[t.id].node;
  if (ok){
    finish(t, 'confirm');
    toast('已确认「'+f.l+'」。节点现在是「'+NODES[nodeNow]+'」。');
  }
  const hero = document.getElementById('hero');
  const y = hero.scrollTop;
  paintChrome();
  paintValues(current());
  hero.scrollTop = y;
}
function applyInput(input){
  const t = current();
  if (!t || !CABS[t.id] || input.disabled) return;
  const key = input.dataset.k;
  let value = input.type==='checkbox' ? (input.checked ? '是' : '') : input.value;
  if (input.dataset.date){
    const n = normDate(value);
    if (n.kind==='ok'){ value = n.v; input.value = value; clearFieldErr(key); }
    else if (n.kind==='bad'){ rememberEdit(t.id, key, value); showFieldErr(key, '4 位数字没法变成月/日。'); return; }
  }
  rememberEdit(t.id, key, value);
  const fv = input.closest('.fv');
  if (fv) fv.classList.toggle('filled', String(value).trim()!=='');
  schedule(t.id, key, value);
}
function acceptAll(){
  const t = current();
  if (!t || !CABS[t.id]) return;
  const before = CABS[t.id].node;
  OPEN[role().sec].forEach(k => {
    const f = fieldBy(k);
    if (!f || f.g || !AI[k]) return;
    const input = document.querySelector('#stepFields input[data-k="'+k+'"], #stepFields textarea[data-k="'+k+'"]');
    if (input) input.value = AI[k];
    rememberEdit(t.id, k, AI[k]);
    commit(t.id, k, AI[k], 'AI');
    const tag = document.querySelector('[data-ai-tag="'+k+'"]');
    if (tag) tag.hidden = true;
  });
  if (CABS[t.id].node!==before) CABS[t.id].node = before;
}
function openHist(key){
  const t = current();
  const pop = document.querySelector('.fv[data-k="'+key+'"] .hist-pop');
  if (!pop || !t) return;
  const rows = ((wbStore()[t.id]||{}).history||{})[key] || [];
  pop.hidden = !pop.hidden;
  pop.innerHTML = rows.length ? rows.map(r => esc(r.who)+' · '+esc(r.how)+' · '+esc(r.from||'（空）')+'→'+esc(r.to)+' · '+esc(r.time)).join('<br>') : '还没有记录';
}
function carryFromPrev(key){
  const ids = queueUids();
  const i = ids.indexOf(state.uid);
  const prev = i>0 ? find(ids[i-1]) : null;
  if (!prev || !CABS[prev.id]) { toast('没有上一柜。'); return; }
  const value = String(vals(prev.id)[key]||'');
  const input = document.querySelector('#statusForm input[data-k="'+key+'"], #statusForm textarea[data-k="'+key+'"]');
  if (input) input.value = value;
  rememberEdit(current().id, key, value);
  const fv = document.querySelector('.fv[data-k="'+key+'"]');
  if (fv){ fv.dataset.carried = '1'; const m = fv.querySelector('[data-from]'); if (m) m.hidden = false; }
  schedule(current().id, key, value);
}
function showCombo(input){
  const list = input.parentElement.querySelector('.combo-list');
  const opts = COMBO[input.dataset.k] || [];
  const q = input.value.trim().toLowerCase();
  const shown = opts.filter(o => !q || o.toLowerCase().includes(q));
  list.innerHTML = shown.map((o,i) => '<li><button type="button" data-act="pickopt" data-opt="'+esc(o)+'"'+(i===0?' class="on"':'')+'>'+esc(o)+'</button></li>').join('') || '<li><span>没有匹配</span></li>';
  list.hidden = false;
  input.setAttribute('aria-expanded','true');
}
function pickCombo(input, value){
  input.value = value;
  const list = input.parentElement.querySelector('.combo-list');
  if (list) list.hidden = true;
  input.setAttribute('aria-expanded','false');
  applyInput(input);
}

document.body.addEventListener('focusout', (e) => {
  const input = e.target.closest && e.target.closest('input[data-combo]');
  if (!input) return;
  setTimeout(() => {
    const list = input.parentElement && input.parentElement.querySelector('.combo-list');
    if (list && !input.parentElement.contains(document.activeElement)) list.hidden = true;
  }, 0);
});
document.body.addEventListener('click', (e) => {
  if (!e.target.closest('.combo')) document.querySelectorAll('.combo-list').forEach(ul => { ul.hidden = true; });
  const el = e.target.closest('[data-act], #acceptAll, #btnReject, #btnRejectOk, #rareTog');
  if (!el){
    if (state.menu && !e.target.closest('.role-anchor')) { state.menu = false; paintChrome(); }
    document.querySelectorAll('.combo-list').forEach(ul => { ul.hidden = true; });
    return;
  }
  const act = el.dataset.act || (el.id==='acceptAll' ? 'accept-all' : el.id==='btnReject' ? 'reject-open' : el.id==='btnRejectOk' ? 'reject-ok' : '');
  if (act==='sel') return;
  if (act==='role-menu'){ state.menu = !state.menu; paintChrome(); return; }
  if (act==='pick'){
    const prev = current();
    if (prev && CABS[prev.id]) flushCab(prev.id);
    state.role = el.dataset.role;
    state.menu = false;
    state.sel.clear();
    state.pane = 'form';
    const r = role();
    const first = r.today[0] || r.done[0] || r.wait[0];
    state.uid = first ? first.uid : '';
    state.fold = {today:false, approve:true, change:true, tomorrow:true, wait:true, done:true};
    ownOpen();
    render();
    return;
  }
  if (act==='fold'){ state.fold[el.dataset.sec] = !state.fold[el.dataset.sec]; paintChrome(); return; }
  if (act==='open'){ switchTo(el.dataset.uid); return; }
  if (act==='jump-first'){
    const first = role().today[0];
    if (first) switchTo(first.uid);
    return;
  }
  if (act==='rare'){ state.rareOpen = !state.rareOpen; document.getElementById('rareFields').hidden = !state.rareOpen; return; }
  if (act==='unload'){
    const t = current();
    const hero = document.getElementById('hero');
    state.savedScroll = hero.scrollTop;
    state.pane = 'unload';
    paintValues(t);
    return;
  }
  if (act==='unload-back'){
    const y = state.savedScroll || 0;
    state.pane = 'form';
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    paintValues(current());
    const hero = document.getElementById('hero');
    hero.scrollTop = y;
    return;
  }
  if (act==='plat'){ toast('这是演示。订单平台在另一张样张里。'); return; }
  if (act==='tool' || act==='quick'){ toast('「'+(el.dataset.tool||el.dataset.name)+'」是演示，还没接真系统。'); return; }
  if (act==='confirm'){ confirmGate(el.dataset.k); return; }
  if (act==='retry'){
    const t = current();
    const key = el.dataset.k;
    const live = draft[t.id] && draft[t.id][key] !== undefined ? draft[t.id][key] : String(vals(t.id)[key]||'');
    commit(t.id, key, live, '自动保存');
    return;
  }
  if (act==='hist'){ openHist(el.dataset.k); return; }
  if (act==='carry'){ carryFromPrev(el.dataset.k); return; }
  if (act==='accept-all'){ acceptAll(); return; }
  if (act==='reject-open'){ state.rejectOpen = true; paintValues(current()); return; }
  if (act==='reason'){ state.rejectReason = el.dataset.reason; return; }
  if (act==='reject-ok'){
    state.rejected = true;
    state.rejectOpen = false;
    const t = current();
    if (t && CABS[t.id]){
      const key = FILE_KEY[role().sec];
      const prev = String(vals(t.id)[key]||'');
      const { s, rec } = cabRec(t.id);
      if (!rec.history[key]) rec.history[key] = [];
      rec.history[key].push({ who: role().name, how: '人工', from: prev, to: '驳回：'+(state.rejectReason||'未写原因'), time: hms() });
      s[t.id] = rec; wbWrite(s);
    }
    paintValues(current());
    return;
  }
  if (act==='pickopt'){
    const input = el.closest('.combo').querySelector('input');
    pickCombo(input, el.dataset.opt);
    return;
  }
  if (act==='upload'){
    const t = current();
    const key = el.dataset.k;
    rememberEdit(t.id, key, 'demo-上传.pdf');
    const input = document.querySelector('.fv[data-k="'+key+'"] input[data-k]');
    if (input) input.value = 'demo-上传.pdf';
    commit(t.id, key, 'demo-上传.pdf', '人工');
    return;
  }
  if (act==='ping'){ toast('已记一条提醒。演示，没有真的发出去。'); return; }
  if (act==='ack'){ finish(current(), 'ack'); toast('已标成看过。不计入今日进度。'); render(); return; }
  if (act==='park'){
    const t = current();
    const r = role();
    for (const k of BUCKETS){
      const i = (r[k]||[]).findIndex(x => x.uid===t.uid);
      if (i>=0){ r[k].splice(i,1); break; }
    }
    t.bucket = 'wait'; t.tag = '等放行'; t.tagKind = 'wait'; t.dot = 'wait'; t.kind = 'ping';
    t.line = (t.id)+' · 等放行';
    r.wait.unshift(t);
    state.uid = (r.today[0]||t).uid;
    state.fold.wait = false;
    toast('已放到等别人。进度环里仍算没做完。');
    render();
    return;
  }
  if (act==='do'){ finish(current(), 'do'); toast('DO 已记下。演示，没有写入真系统。'); render(); return; }
  if (act==='approve'){ finish(current(), 'approve'); toast('已同意。演示，没有写入真系统。'); render(); return; }
  if (act==='batch'){
    const t = current();
    if (t && CABS[t.id]) flushCab(t.id);
    const key = document.getElementById('batchKey').value;
    const value = document.getElementById('batchVal').value.trim();
    state.batchKey = key;
    const picked = [...state.sel].map(find).filter(x => x && CABS[x.id]);
    if (!picked.length){ toast('先在左边勾上柜。'); return; }
    const nodes = new Set(picked.map(x => CABS[x.id].node));
    if (nodes.size>1){ toast('要同一节点的柜才能一起填。'); return; }
    if (!value){ toast('先写要填进去的值。'); return; }
    const label = fieldBy(key).l;
    picked.forEach(x => {
      if (!draft[x.id]) draft[x.id] = {};
      draft[x.id][key] = value;
      vals(x.id)[key] = value;
      commit(x.id, key, value, '自动保存');
    });
    toast('已把「'+label+'」填到 '+picked.length+' 柜。只记下值，没有推进节点。');
    const hero = document.getElementById('hero');
    const y = hero.scrollTop;
    paintChrome();
    paintValues(current());
    hero.scrollTop = y;
  }
});
document.body.addEventListener('change', (e) => {
  const sel = e.target.closest('[data-act="sel"]');
  if (sel){
    if (sel.checked) state.sel.add(sel.dataset.uid);
    else state.sel.delete(sel.dataset.uid);
    const hero = document.getElementById('hero');
    const y = hero.scrollTop;
    paintChrome();
    paintValues(current());
    hero.scrollTop = y;
    return;
  }
  const cal = e.target.closest('[data-cal]');
  if (cal && cal.value){
    const [y,m,d] = cal.value.split('-');
    const input = document.querySelector('#statusForm input[data-k="'+cal.dataset.cal+'"]');
    if (input){ input.value = m+'/'+d; applyInput(input); }
  }
});
document.body.addEventListener('input', (e) => {
  const input = e.target.closest('#statusForm input[data-k], #statusForm textarea[data-k]');
  if (!input || input.disabled || input.dataset.cal) return;
  if (input.dataset.combo){ showCombo(input); }
  applyInput(input);
});
document.body.addEventListener('paste', (e) => {
  const step = e.target.closest('#stepFields');
  if (!step) return;
  const text = (e.clipboardData && e.clipboardData.getData('text')) || '';
  if (!text.includes('\t') && !text.includes(',')) return;
  e.preventDefault();
  const cells = text.trim().split(/\t|,/).map(s => s.trim());
  const inputs = [...step.querySelectorAll('input[data-k]')];
  if (cells.length !== inputs.length){
    const n = Math.min(cells.length, inputs.length);
    const miss = cells.length>inputs.length ? (n+1) : (cells.length+1);
    showFieldErr(inputs[0].dataset.k, '第 '+miss+' 列没对上。已敲的字还在。');
    return;
  }
  inputs.forEach((input, i) => { input.value = cells[i]; applyInput(input); });
});
document.body.addEventListener('keydown', (e) => {
  if (e.altKey && (e.key==='ArrowUp' || e.key==='ArrowDown')){
    const ids = queueUids();
    const i = Math.max(0, ids.indexOf(state.uid));
    const n = e.key==='ArrowDown' ? ids[Math.min(ids.length-1, i+1)] : ids[Math.max(0, i-1)];
    if (n && n!==state.uid){ e.preventDefault(); switchTo(n); }
    return;
  }
  const input = e.target.closest('#statusForm input[data-k]');
  if (!input) return;
  if (e.key==='ArrowDown' && input.dataset.combo){
    e.preventDefault();
    showCombo(input);
    const first = input.parentElement.querySelector('.combo-list button');
    if (first) first.focus();
    return;
  }
  if (e.key==='Enter'){
    e.preventDefault();
    const f = fieldBy(input.dataset.k);
    if (input.dataset.combo){
      const on = input.parentElement.querySelector('.combo-list button.on') || input.parentElement.querySelector('.combo-list button');
      if (on && !input.parentElement.querySelector('.combo-list').hidden){ pickCombo(input, on.dataset.opt); return; }
    }
    if (f && f.g){ confirmGate(f.k); return; }
    const all = [...document.querySelectorAll('#stepFields input[data-k]:not([disabled])')];
    const idx = all.indexOf(input);
    const next = all[idx+1];
    if (next) next.focus({ preventScroll:true });
  }
});
document.body.addEventListener('keydown', (e) => {
  if (e.key==='Enter' && e.target.dataset && e.target.dataset.act==='pickopt'){
    e.preventDefault();
    const input = e.target.closest('.combo').querySelector('input');
    pickCombo(input, e.target.dataset.opt);
  }
});

render();
</script>
</body>
