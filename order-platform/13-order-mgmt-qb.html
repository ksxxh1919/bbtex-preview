<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232CA01C'/%3E%3C/svg%3E">
<title>订单平台 · 柜号在左侧待办下 · BBTEX</title>
<style>

:root{
  --font:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --font-id:"Inter","Noto Sans SC",sans-serif;
  --bg:#F5F5F7; --surface:#FFFFFF; --sunken:#F0F0F3;
  --nav-bg:#F7F7F8; --nav-hover:#EEEEF1; --nav-active:#FFFFFF;
  --line:#E6E6EA; --line-soft:#EFEFF2; --row-line:#EAEAEE;
  --t1:#121217; --t2:#2F2F38; --t3:#585864; --t4:#6E6E79; --t5:#9A9AA4;
  --accent:#4C5BD4; --accent-hover:#4250C4; --accent-tint:#EEF0FC; --accent-text:#3B48B8; --on-accent:#fff;
  --ok:#0E7A47; --ok-bg:#E8F6EF;
  --warn:#8A5200; --warn-bg:#FDF3E1; --warn-dot:#C47A00;
  --danger:#C62828; --danger-bg:#FDEDED;
  --info:#3B48B8; --info-bg:#EEF0FC;
  --done:#585864; --done-bg:#F1F1F3;
  /* 优先级语义色：特急红 / 紧急橙 / 普通弱蓝灰 */
  --p-urgent:#B71C1C; --p-urgent-bg:#FCE8E6; --p-urgent-line:#F5C4BF;
  --p-high:#B86E00; --p-high-bg:#FDF3E1; --p-high-line:#F0D4A0;
  --p-norm:#4A5568; --p-norm-bg:#EEF1F6; --p-norm-line:#D5DBE5;
  --r:8px; --r-sm:6px; --r-lg:10px;
  --sh:0 0 0 1px rgba(20,20,30,.06),0 1px 2px rgba(20,20,30,.04);
  --nav-w:224px; --top-h:52px; --row-h:52px;
  --co-all:#18181D; --co-blt:#0E9384; --co-xt:#D9692A; --co-amcx:#8A4FD6;
}


*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100vh;min-width:1180px}
.nav{background:var(--nav-bg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand .logo{width:28px;height:28px;border-radius:7px;background:#18181D;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.brand b{display:block;font-size:13px;font-weight:600;line-height:18px}
.brand small{display:block;font-size:11px;color:var(--t4);line-height:14px}
.co-switch{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--surface);box-shadow:var(--sh);margin:0 2px 12px;cursor:pointer}
.co-switch .sq{width:8px;height:8px;border-radius:2px;background:var(--co-all);flex:none}
.co-switch b{font-size:12.5px;font-weight:600;line-height:16px}
.co-switch small{font-size:11px;color:var(--t4);line-height:14px}
.co-switch .chev{margin-left:auto;color:var(--t5);font-size:11px}
.grp{font-size:11px;font-weight:600;color:var(--t4);letter-spacing:.04em;padding:10px 12px 4px}
.ni{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:7px;color:var(--t3);font-size:13px;cursor:pointer}
.ni:hover{background:var(--nav-hover);color:var(--t2)}
.ni.on{background:var(--nav-active);color:var(--t1);font-weight:600;box-shadow:var(--sh)}
.ni .ic{width:16px;height:16px;opacity:.75;flex:none}
.ni.on .ic{opacity:1;color:var(--accent)}
.ni .badge{margin-left:auto;font-size:11px;font-weight:600;background:#EDEDF0;color:#5A5A64;padding:0 6px;height:18px;line-height:18px;border-radius:9px;font-variant-numeric:tabular-nums}
.ni .badge.alert{background:var(--p-urgent-bg);color:var(--p-urgent)}
.nav-fill{flex:1}
.nav-foot{padding-top:8px;border-top:1px solid var(--line-soft);margin-top:8px}
.me{display:flex;align-items:center;gap:10px;padding:10px 8px 4px}
.me .av{width:28px;height:28px;border-radius:50%;background:#E8E8EC;color:var(--t2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.me b{display:block;font-size:13px;line-height:16px}
.me small{display:block;font-size:11px;color:var(--t4)}
.main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.top{height:var(--top-h);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px 0 24px;position:sticky;top:0;z-index:10}
.test-bar{height:3px;background:linear-gradient(90deg,#E59A13,#F5C26B);flex:none}
.test-badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:4px;background:#FDF3E1;color:var(--warn);font-size:12px;font-weight:600;border:1px solid #F5DDB0}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px;background:var(--sunken);color:var(--t4);font-size:13px;min-width:260px;flex:1;max-width:400px}
.search .kbd{margin-left:auto;font-size:11px;background:var(--surface);border:1px solid var(--line);padding:1px 6px;border-radius:4px;color:var(--t4)}
.top-sp{flex:1}
.top-actions{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:7px;border:1px solid transparent;font-size:13px;font-weight:500;cursor:pointer;background:transparent;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.secondary{background:var(--surface);border-color:var(--line);color:var(--t2);box-shadow:var(--sh)}
.btn.ghost{color:var(--t3)}.btn.ghost:hover{background:var(--sunken);color:var(--t2)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:6px}
.page{padding:18px 28px 40px;max-width:1320px;width:100%}
.page-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
.page-hd h1{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:30px}
.page-hd .sub{font-size:13px;color:var(--t3);margin-top:4px;line-height:1.55}
.page-hd .sub b{color:var(--t1);font-weight:600}
.scheme-note{margin-top:28px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--t4);line-height:1.7}
.id{font-family:var(--font-id);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"zero" 1;font-weight:500;letter-spacing:.01em;font-size:13px}
a.id-link{color:var(--accent-text);font-family:var(--font-id);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"zero" 1;font-weight:600;letter-spacing:.01em;font-size:13px;text-decoration:underline;text-decoration-color:rgba(59,72,184,.35);text-underline-offset:2px}
a.id-link:hover{color:var(--accent);text-decoration-color:var(--accent)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.cotag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--t2)}
.cotag i{width:8px;height:8px;border-radius:2px;flex:none}
.plat{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;font-size:11.5px;font-weight:500;background:var(--sunken);color:var(--t3)}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-bottom:1px solid var(--line-soft)}
.card-h h3{font-size:14px;font-weight:600}
.card-h .sp{flex:1}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;font-weight:500;color:var(--t3);height:36px;padding:0 12px;background:#FAFAFB;border-bottom:1px solid var(--line)}
.tbl td{height:var(--row-h);padding:8px 12px;border-bottom:1px solid var(--row-line);font-size:13.5px;color:var(--t1);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#F8F8FA}
.tbl .r{text-align:right}
.tbl tr.prio-urgent{box-shadow:inset 3px 0 0 var(--p-urgent)}
.tbl tr.prio-high{box-shadow:inset 3px 0 0 var(--p-high)}
.two{display:flex;flex-direction:column;gap:2px;line-height:18px}
.two small{font-size:12px;color:var(--t3)}
.status-text{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--t2)}
.status-text .dot{width:8px;height:8px;border-radius:50%;flex:none}
.status-text.danger{color:var(--danger)}.status-text.danger .dot{background:var(--danger)}
.status-text.warn{color:var(--warn)}.status-text.warn .dot{background:var(--warn-dot)}
.status-text.ok{color:var(--ok)}.status-text.ok .dot{background:var(--ok)}
.status-text.info{color:var(--info)}.status-text.info .dot{background:var(--accent)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:500;gap:5px}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}
.pill.info{background:var(--info-bg);color:var(--accent-text)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.done{background:var(--done-bg);color:var(--done)}
/* 优先级徽章 */
.prio{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.prio .dot{width:6px;height:6px;border-radius:50%;flex:none}
.prio.urgent{background:var(--p-urgent-bg);color:var(--p-urgent);border-color:var(--p-urgent-line)}
.prio.urgent .dot{background:var(--p-urgent)}
.prio.high{background:var(--p-high-bg);color:var(--p-high);border-color:var(--p-high-line)}
.prio.high .dot{background:var(--p-high)}
.prio.norm{background:var(--p-norm-bg);color:var(--p-norm);border-color:var(--p-norm-line)}
.prio.norm .dot{background:#718096}
.prio-counts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.prio-count{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;background:var(--surface);box-shadow:var(--sh);font-size:13px;font-weight:500}
.prio-count b{font-size:16px;font-variant-numeric:tabular-nums;font-weight:700}
.prio-count.urgent{border-left:3px solid var(--p-urgent)}
.prio-count.urgent b{color:var(--p-urgent)}
.prio-count.high{border-left:3px solid var(--p-high)}
.prio-count.high b{color:var(--p-high)}
.prio-count.norm{border-left:3px solid #A0AEC0}
.prio-count.norm b{color:var(--p-norm)}
.prio-count.overdue{border-left:3px solid var(--danger)}
.prio-count.overdue b{color:var(--danger)}
.prio-legend{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--t4);margin-bottom:12px;flex-wrap:wrap}
.prio-legend span{display:inline-flex;align-items:center;gap:5px}
.prio-legend i{width:8px;height:8px;border-radius:2px}
.ai-side{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh);border-left:3px solid var(--accent);padding:14px 16px}
.ai-side .tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--accent-text);background:var(--accent-tint);padding:2px 7px;border-radius:4px;margin-bottom:8px}
.ai-side b{display:block;font-size:13.5px;line-height:20px;margin-bottom:4px}
.ai-side p{font-size:12.5px;color:var(--t3);line-height:19px}
.ai-side .acts{display:flex;gap:6px;margin-top:10px}


/* ===== 13 QB 模式 · v1.3.15：柜号嵌在深炭侧栏（待办 / 全部下面），中间栏取消 ===== */
:root{
  /* @1440：侧栏 320（柜号+圆点+短标签+日期刚够一行），右边 1120。不再 1:φ，否则侧栏会被撑到 550。 */
  --phi:1.618;
  --nav-plat:210px; /* 收起柜号列表后，侧栏缩回平台导航 */
  --side:360px; /* 13px 柜号 + 12px 标签 + 8px 间距，一行不挤 */
  --top-h:55px; /* ≈ 34+21 */
  --sp1:8px; --sp2:13px; --sp3:21px; --sp4:34px;
  --r:8px; --r-sm:6px; --r-lg:13px;
  /* QB palette */
  --qb-nav:#2C3038;
  --qb-nav-hi:#363B45;
  --qb-nav-active:#3D4450;
  --qb-nav-text:#C8CDD6;
  --qb-nav-mute:#8B929E;
  --qb-green:#2CA01C;
  --qb-green-dark:#248A16;
  --qb-blue:#2CA01C; /* primary CTA = QB green sparingly; links use blue */
  --accent:#2E7BE5;
  --accent-hover:#1F6AD1;
  --accent-tint:#E8F1FC;
  --accent-text:#1A5FB4;
  --ok:#2CA01C; --ok-bg:#E8F6E8;
  --bg:#F0F2F5; /* light gray main canvas */
  --surface:#FFFFFF;
  --sunken:#F4F5F7;
  --nav-bg:var(--qb-nav);
  --nav-hover:var(--qb-nav-hi);
  --nav-active:var(--qb-nav-active);
  --line:#E3E6EB; --line-soft:#ECEEF2; --row-line:#EEF0F3;
  --t1:#1A1D23; --t2:#3A3F4A; --t3:#5C6370; --t4:#7A8290; --t5:#A0A7B4;
  --sh:0 0 0 1px rgba(26,29,35,.04);
  --sh-card:0 0 0 1px rgba(26,29,35,.06),0 1px 2px rgba(26,29,35,.04);
  --gate-sh:0 0 0 1px rgba(46,123,229,.12),0 2px 10px -4px rgba(46,123,229,.14);
  --warn:#B86E00; --warn-bg:#FFF8EB; --warn-dot:#C47A00;
  --danger:#C62828; --danger-bg:#FDEDED;
  --p-urgent:#B71C1C; --p-urgent-bg:#FCE8E6; --p-urgent-line:#F5C4BF;
  --p-high:#B86E00; --p-high-bg:#FDF3E1; --p-high-line:#F0D4A0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}


/* v1.3.15：两栏。侧栏只加宽到装得下柜号行；腾出的宽度给右边操作线。 */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh;min-width:1180px}
.app.collapsed{grid-template-columns:var(--nav-plat) minmax(0,1fr)}
.app.collapsed .order-nest{display:none !important}

/* —— 深炭左导航（QB 色 · 老系统位置）：平台菜单 · 订单平台 ▸ 待办 / 全部 —— */
.rail{background:var(--qb-nav);display:flex;flex-direction:column;padding:var(--sp2) var(--sp1) var(--sp1);position:sticky;top:0;height:100vh;overflow:hidden;color:var(--qb-nav-text);min-width:0;scrollbar-width:none}
.rail-top{flex:none;position:relative;z-index:6}
.rail-mid{flex:1;min-height:0;display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto}
.app.collapsed .rail-mid{overflow-y:auto}
.order-nest{display:flex;flex-direction:column;min-height:0;flex:none}
.order-nest:not(.shut){flex:none}
.nest-panel{display:none;min-height:0}
.nest-panel.open{display:flex;flex-direction:column;flex:none;min-height:0;overflow:visible}
.brand{display:flex;align-items:center;gap:10px;padding:2px var(--sp1) var(--sp2);flex:none}
.brand .logo{width:28px;height:28px;border-radius:var(--r);background:var(--qb-green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.brand b{display:block;font-size:13px;font-weight:650;line-height:18px;color:#fff;letter-spacing:.02em;white-space:nowrap}
.brand small{display:block;font-size:10.5px;color:var(--qb-nav-mute);line-height:13px;white-space:nowrap}
.create-btn{font:inherit;display:flex;align-items:center;justify-content:center;gap:6px;height:32px;margin:0 var(--sp1) var(--sp2);border-radius:999px;border:1.5px solid rgba(255,255,255,.28);background:transparent;color:#fff;font-size:13px;font-weight:600;cursor:pointer;flex:none}
.create-btn:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.45)}
.create-btn .plus{font-size:16px;line-height:1;font-weight:400}
.co-switch{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r);background:rgba(255,255,255,.06);margin:0 var(--sp1) var(--sp1);cursor:pointer;flex:none}
.co-switch .sq{width:7px;height:7px;border-radius:2px;background:var(--qb-green);flex:none}
.co-switch b{display:block;font-size:13px;font-weight:600;line-height:18px;color:#E8EAEE}
.co-switch small{display:block;font-size:12px;color:var(--qb-nav-mute);line-height:16px}
.co-switch .chev{margin-left:auto;color:var(--qb-nav-mute);font-size:10px}
.grp{font-size:12px;font-weight:650;color:var(--qb-nav-mute);letter-spacing:.06em;padding:var(--sp2) 12px 4px;flex:none}
.ni{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:var(--r);color:var(--qb-nav-text);font-size:13px;cursor:pointer;position:relative;margin:1px 0;flex:none;user-select:none}
.ni:hover{background:var(--qb-nav-hi);color:#fff}
.ni.on{background:var(--qb-nav-active);color:#fff;font-weight:600}
.ni.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--qb-green)}
.ni .ic{width:16px;height:16px;opacity:.7;flex:none;color:currentColor}
.ni.on .ic{opacity:1;color:#fff}
.ni .badge{margin-left:auto;font-size:12px;font-weight:650;background:rgba(255,255,255,.12);color:#E8EAEE;padding:0 6px;height:18px;line-height:18px;border-radius:9px;font-variant-numeric:tabular-nums}
.ni .badge.alert{background:rgba(198,40,40,.35);color:#FFCDD2}
.ni .pcar{font-size:9px;color:var(--qb-nav-mute);width:10px;text-align:center;transition:transform .15s;flex:none}
.ni.plat .badge{display:none}
.app.collapsed .ni.plat .badge{display:inline-block}
.app.collapsed .ni .pcar{transform:rotate(-90deg)}
/* 订单平台下的二级：待办 / 全部（选中哪个，中间列表就是哪个） */
.sub-ni{display:flex;align-items:center;gap:8px;height:36px;margin:2px 0 2px 22px;padding:0 10px 0 12px;border-radius:var(--r-sm);color:var(--qb-nav-text);font-size:13px;cursor:pointer;position:relative;flex:none;border-left:1px solid rgba(255,255,255,.1);border-radius:0 var(--r-sm) var(--r-sm) 0}
.sub-ni:hover{background:var(--qb-nav-hi);color:#fff}
.sub-ni.on{background:rgba(255,255,255,.1);color:#fff;font-weight:650;border-left:2px solid var(--qb-green)}
.sub-ni .badge{margin-left:auto;font-size:12px;font-weight:650;padding:0 6px;height:18px;line-height:18px;border-radius:9px;background:rgba(46,123,229,.4);color:#E3EEFC;font-variant-numeric:tabular-nums}
.sub-ni .badge.zero{background:transparent;color:var(--qb-nav-mute)}
.sub-ni .cnt{margin-left:auto;font-size:12px;color:var(--qb-nav-mute);font-variant-numeric:tabular-nums}
.sub-ni .arrow{font-size:10px;color:var(--qb-nav-mute);margin-left:4px;opacity:1;transition:transform .15s;display:inline-block}
.sub-ni:not(.open) .arrow{transform:rotate(-90deg)}
.app.collapsed .sub-ni{display:none}
.nav-fill{display:none}
.nav-foot{padding-top:var(--sp1);border-top:1px solid rgba(255,255,255,.08);margin-top:var(--sp1);flex:none;position:relative;z-index:6}
.role-anchor{position:relative}
.me{display:flex;align-items:center;gap:10px;padding:8px 8px 2px}
.me .av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.me b{display:block;font-size:13px;line-height:18px;color:#E8EAEE}
.me small{display:block;font-size:12px;color:var(--qb-nav-mute);white-space:nowrap}

/* —— 中间：订单列表（老系统主从的「订单列表」卡；紧贴导航，属于左边那 1 份） —— */
.list-pane{background:var(--bg);padding:var(--sp2) 0 var(--sp2) var(--sp2);position:sticky;top:0;height:100vh;min-width:0;display:flex}
.lp-card{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-card);overflow:hidden}
.lp-hd{padding:var(--sp2) var(--sp2) 0;flex:none}
.lp-hd h2{font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:22px;display:flex;align-items:baseline;gap:6px}
.lp-hd h2 .crumbv{font-size:11.5px;font-weight:500;color:var(--t4)}
.lp-hd h2 .cnt{font-size:12px;font-weight:600;color:var(--t4);background:var(--sunken);border-radius:9px;padding:0 7px;height:18px;line-height:18px;font-variant-numeric:tabular-nums}
.lp-hd h2 .sp{flex:1}
.lp-hd .hd-ic{font-size:11.5px;font-weight:500;color:var(--accent-text);cursor:pointer;border:0;background:none;font-family:inherit}
#tree{flex:1;min-height:0;display:flex;flex-direction:column}
.vbody{flex:1;min-height:0;display:flex;flex-direction:column}
.vhead{flex:none;padding:var(--sp1) var(--sp2) 0}
.cab-scroll{flex:1;min-height:0;overflow-y:auto;padding:2px var(--sp1) var(--sp1);scrollbar-width:thin}
.lp-foot{flex:none;display:flex;align-items:center;gap:8px;height:34px;padding:0 var(--sp2);border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--t4);font-variant-numeric:tabular-nums}
.lp-foot b{color:var(--t2);font-weight:600}
.lp-foot .sp{flex:1}

/* 搜索（老系统：列表顶部一条搜索）+ 今日芯片 */
.nav-search{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:var(--r);background:var(--sunken);color:var(--t4);font-size:12.5px;margin-bottom:var(--sp1);border:1px solid transparent}
.nav-search:focus-within{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,123,229,.12)}
.nav-search input{flex:1;border:0;background:transparent;outline:none;font:inherit;color:var(--t1);min-width:0}
.nav-search input::placeholder{color:var(--t5)}
.nav-search .kbd{font-size:10px;background:var(--surface);border:1px solid var(--line-soft);padding:0 4px;border-radius:3px;color:var(--t5);flex:none;height:16px;line-height:14px}
.today-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:var(--sp1)}
.tchip{font:inherit;display:flex;align-items:baseline;justify-content:space-between;gap:4px;height:30px;padding:0 10px;border-radius:var(--r-sm);background:var(--sunken);cursor:pointer;transition:all .12s;color:inherit;border:0;align-items:center}
.tchip:hover{background:#E8EAEE}
.tchip.on{background:var(--surface);box-shadow:var(--sh-card)}
.tchip .tl{font-size:11px;font-weight:550;color:var(--t4);line-height:1;padding:0;border:0;margin:0}
.tchip .tn{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;color:var(--t1);display:inline;padding:0;margin:0;background:none;position:static}
.tchip .tn::before{display:none}
.tchip.work .tn{color:var(--accent-text)}
.tchip.due{background:#FFFBF3}
.tchip.due .tn{color:var(--warn)}
.tchip.due.on{box-shadow:0 0 0 1px var(--p-high-line),var(--sh)}
.tchip.exc{background:#FFF8F7}
.tchip.exc .tn{color:var(--p-urgent)}
.tchip.exc.on{box-shadow:0 0 0 1px var(--p-urgent-line),var(--sh)}
.tchip.zero .tn{color:var(--t5);font-weight:600}
.vrow{display:block}

/* 工具行：勾选 · 批量 · 只看柜号 · 筛选 · 收起 */
.list-tools{display:flex;align-items:center;gap:6px;height:28px;padding:0 2px 0 6px;margin:0 0 2px;position:relative;border-top:1px solid var(--line-soft);padding-top:6px;height:34px}
.list-tools .lt-l{font-size:11px;color:var(--t5);white-space:nowrap}
.list-tools .lt-l.on{color:var(--accent-text);font-weight:600}
.list-tools .lt-sp{flex:1}
.tbtn{font:inherit;height:22px;padding:0 7px;font-size:11.5px;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--t2);cursor:pointer;font-weight:550;flex:none;white-space:nowrap}
.tbtn:hover:not(:disabled){background:var(--accent-tint);border-color:#C5D9F5;color:var(--accent-text)}
.tbtn:disabled{opacity:.45;cursor:default}
.tbtn.on{background:var(--accent-tint);border-color:#C5D9F5;color:var(--accent-text);font-weight:650}
.bmenu{display:none;position:absolute;left:4px;top:34px;z-index:30;min-width:220px;background:#fff;border-radius:var(--r);box-shadow:0 0 0 1px rgba(20,20,30,.08),0 8px 24px -6px rgba(20,20,30,.18);padding:4px}
.bmenu.open{display:block}
.bmenu button{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:7px 9px;border:0;background:transparent;border-radius:6px;font:inherit;cursor:pointer;text-align:left}
.bmenu button:hover{background:var(--sunken)}
.bmenu button b{font-size:12.5px;font-weight:600;color:var(--t1)}
.bmenu button span{font-size:10.5px;color:var(--t4);margin-top:1px}
.bmenu .bm-h{font-size:10px;font-weight:650;color:var(--t5);letter-spacing:.04em;padding:4px 9px 2px}
.ck{width:13px;height:13px;border-radius:3.5px;border:1.5px solid #C9C9D1;background:#fff;flex:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s}
.ck.on,.ck.part{background:var(--accent);border-color:var(--accent)}
.ck.on::after{content:'';width:6px;height:3.5px;border-left:1.6px solid #fff;border-bottom:1.6px solid #fff;transform:rotate(-45deg) translate(.5px,-.5px)}
.ck.part::after{content:'';width:6px;height:1.6px;background:#fff;border-radius:1px}

/* 筛选（折叠） */
.filt-body{display:none;margin:0 0 6px;padding:4px 4px 6px 8px;border-left:2px solid var(--line-soft)}
.filt-body.open{display:block}
.sort-sec{margin:2px 0}
.sort-h{display:flex;align-items:center;gap:5px;height:22px;padding:0 4px;font-size:10px;font-weight:650;color:var(--t5);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;user-select:none}
.sort-h .car{font-size:8px;transition:transform .15s}
.sort-sec.fold .car{transform:rotate(-90deg)}
.sort-sec.fold .sort-items,.sort-sec.fold .sort-radios{display:none}
.sort-items,.sort-radios{display:grid;grid-template-columns:1fr 1fr;column-gap:4px}
.si,.rd{display:flex;align-items:center;gap:7px;height:25px;padding:0 6px;border-radius:5px;color:var(--t3);font-size:12px;cursor:pointer}
.si:hover,.rd:hover{background:var(--sunken);color:var(--t2)}
.si.on,.rd.on{background:var(--accent-tint);color:var(--t1);font-weight:600}
.si .dot{width:6px;height:6px;border-radius:50%;flex:none}
.si .stepn{width:14px;height:14px;border-radius:50%;background:#EEEEEF;color:var(--t4);font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.si .stepn.fin{border:1.5px dashed #A8C8F0;background:var(--accent-tint);color:var(--accent-text);border-radius:3px}
.si .ct{margin-left:auto;font-size:10.5px;color:var(--t4);font-variant-numeric:tabular-nums}
.si .ct.red{background:var(--p-urgent-bg);color:var(--p-urgent);padding:0 4px;border-radius:7px;font-weight:650;height:15px;line-height:15px}
.si .ct.zero{color:var(--t5)}
.rd .o{width:11px;height:11px;border-radius:50%;border:1.5px solid #C9C9D1;flex:none;position:relative}
.rd.on .o{border-color:var(--accent)}
.rd.on .o::after{content:'';position:absolute;inset:2px;border-radius:50%;background:var(--accent)}

/* 柜号行（老系统：柜号 + 右侧状态胶囊；完整行再加 MBL / 订单号 / 白话） */
.cab-list{margin:0;padding:0}
.cab{display:grid;grid-template-columns:13px 1fr auto;column-gap:10px;align-items:start;padding:9px 10px 9px 12px;border-radius:var(--r);cursor:pointer;position:relative;margin-bottom:1px;text-decoration:none;color:inherit;border-bottom:1px solid var(--row-line)}
.cab:last-child{border-bottom-color:transparent}
.cab:hover{background:var(--sunken)}
.cab.on{background:var(--accent-tint);border-bottom-color:transparent}
.cab.on::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--accent)}
.cab.prio-urgent:not(.on)::before,.cab.prio-high:not(.on)::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px}
.cab.prio-urgent:not(.on)::before{background:var(--p-urgent)}
.cab.prio-high:not(.on)::before{background:var(--p-high)}
.cab .cid{font-family:var(--font-id);font-weight:650;font-size:13px;letter-spacing:.01em;font-variant-numeric:tabular-nums;color:var(--accent-text);display:flex;align-items:center;gap:6px;line-height:18px}
.cab .sub2{font-size:11px;color:var(--t4);margin-top:2px;line-height:14px;font-family:var(--font-id);font-variant-numeric:tabular-nums;display:flex;gap:8px}
.cab .sub2 .ord{margin-left:auto}
.cab .cmeta{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:4px;font-size:10.5px;font-weight:650;white-space:nowrap;background:var(--accent-tint);color:var(--accent-text);margin-top:0}
.cab .cmeta.hot{background:var(--danger-bg);color:var(--danger)}
.cab .cmeta.due{background:var(--warn-bg);color:var(--warn)}
.cab .cmeta.fin{background:var(--ok-bg);color:var(--ok)}
.cab .cmeta.done{background:var(--ok-bg);color:var(--ok)}
.cab .do{font-size:11.5px;font-weight:500;color:var(--t2);margin-top:3px;line-height:15px}
.cab .do.hot{color:var(--p-urgent);font-weight:650}
.cab .do.due{color:var(--warn);font-weight:600}
.cab .due-line{font-size:10.5px;color:var(--t4);margin-top:2px;font-variant-numeric:tabular-nums;line-height:14px}
.cab .due-line .hot{color:var(--danger);font-weight:650}
.cab .due-line .soon{color:var(--warn);font-weight:600}
.cab .ck{margin-top:3px;opacity:.38}
.cab:hover .ck,.cab .ck.on{opacity:1}
.cab.sel{background:#F0F5FC}
.cab.sel.on{background:var(--accent-tint)}
.cab-empty{padding:var(--sp3) var(--sp2);text-align:center;color:var(--t4);font-size:12.5px}
.cab .cdots{display:inline-flex;align-items:center;gap:3px;margin-left:2px}
.cab .cdot{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block}
.cab .cdot.urgent{background:var(--p-urgent)}
.cab .cdot.high{background:var(--p-high)}
.cab .cdot.exc{background:var(--danger);width:7px;height:7px;border-radius:2px}
.cab .cdot.fh{background:#C62828}
.cab .cdot.insp{background:var(--warn)}
.cab .cdot.doc{background:#9A9AA4}
.done-grp{margin-top:4px;border-top:1px dashed var(--line);padding-top:4px}
.done-tog{display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;font-size:11px;color:var(--ok);font-weight:600;cursor:pointer;border-radius:5px;user-select:none}
.done-tog:hover{background:var(--sunken)}
.done-tog .car{font-size:8px;color:var(--t5);transition:transform .15s}
.done-tog.fold .car{transform:rotate(-90deg)}
.cab.dt-done .cid{color:var(--t3)}
.cab.dt-done .do{color:var(--ok);font-weight:550}
.cab.dt-done .due-line{display:none}
.app.compact .cab{padding:7px 10px 7px 12px;align-items:center}
.app.compact .cab .ck{margin-top:0}
.app.compact .cab .do,.app.compact .cab .due-line,.app.compact .cab .sub2{display:none}
.app.compact .cab .cid .prio,.app.compact .cab .cid .flags{display:none}
.app.compact .cab.on::before,.app.compact .cab.prio-urgent:not(.on)::before,.app.compact .cab.prio-high:not(.on)::before{top:6px;bottom:6px}
.app:not(.compact) .cab .cdots{display:none}

/* 标签（主区用） */
.prio{display:inline-flex;align-items:center;gap:3px;height:16px;padding:0 5px;border-radius:3px;font-size:10px;font-weight:650}
.prio .dot{width:4px;height:4px;border-radius:50%}
.prio.urgent{background:var(--p-urgent-bg);color:var(--p-urgent)}
.prio.urgent .dot{background:var(--p-urgent)}
.prio.high{background:var(--p-high-bg);color:var(--p-high)}
.prio.high .dot{background:var(--p-high)}
.flag{display:inline-flex;align-items:center;justify-content:center;height:14px;padding:0 3px;border-radius:3px;font-size:9.5px;font-weight:700;line-height:1}
.flag.exc{background:var(--danger-bg);color:var(--danger)}
.flag.insp{background:var(--warn-bg);color:var(--warn)}
.flag.fh{background:#FCE8E6;color:#B71C1C}
.flag.doc{background:#F1F1F3;color:#585864}
.flags{display:inline-flex;gap:2px;align-items:center}
.ccode{font-family:var(--font-id);font-weight:650;font-size:11px;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--accent-text);background:var(--accent-tint);border-radius:3px;padding:0 5px;display:inline-flex;align-items:center;height:16px}
.id{font-family:var(--font-id);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;font-weight:500;font-size:12.5px}

/* —— 主区（浅灰画布 + 白卡片） —— */
.main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.test-bar{height:0;display:none}
.top{height:var(--top-h);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:var(--sp2);padding:0 var(--sp3) 0 var(--sp3);position:sticky;top:0;z-index:10}
.test-badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:4px;background:#FDF3E1;color:var(--warn);font-size:11.5px;font-weight:600;border:1px solid #F5DDB0}
.top-co{font-size:13px;font-weight:650;letter-spacing:.04em;color:var(--t1);text-transform:uppercase;white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:999px;background:var(--sunken);color:var(--t4);font-size:13px;min-width:240px;flex:1;max-width:420px}
.search .kbd{margin-left:auto;font-size:11px;background:var(--surface);border:1px solid var(--line);padding:1px 6px;border-radius:4px;color:var(--t4)}
.top-sp{flex:1}
.top-actions{display:flex;align-items:center;gap:var(--sp1)}
.rev-pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:4px;background:var(--ok-bg);color:var(--ok);font-size:11px;font-weight:700;border:1px solid #BFE5C8}

.dt{padding:var(--sp3) var(--sp4) 48px;min-width:0;overflow-y:auto;max-height:calc(100vh - var(--top-h));max-width:none}
.crumb{font-size:13px;color:var(--t4);margin-bottom:var(--sp2)}
.crumb a{color:var(--t3)}
.dt-hd{display:flex;align-items:flex-start;gap:var(--sp2);margin-bottom:var(--sp3)}
.dt-hd h1{font-family:var(--font-id);font-size:22px;font-weight:650;letter-spacing:.01em;display:flex;align-items:center;gap:8px;line-height:28px}
.dt-hd .sub{font-size:13px;color:var(--t3);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;line-height:1.5}
.dt-hd .sub .sep{color:var(--t5)}
.dt-hd .sp{flex:1}
.banner{margin-bottom:var(--sp2);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.4}
.banner b{font-weight:650}
.banner .bx{margin-left:auto;font-size:11.5px;white-space:nowrap;opacity:.85}
.banner .bi{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;font-weight:700;font-size:11px}
.banner.fh{background:var(--danger-bg);color:var(--danger)}
.banner.fh .bi{background:var(--danger);color:#fff}
.banner.exc{background:#FFF8F7;border-left:3px solid var(--danger);color:var(--danger)}
.banner.exc .bi{background:var(--danger-bg);color:var(--danger)}
.banner.insp{background:var(--warn-bg);color:var(--warn)}
.banner.insp .bi{background:#FDE7C2;color:var(--warn)}

.trk{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-card);padding:var(--sp3) var(--sp3) 14px;margin-bottom:var(--sp2)}
.status-line{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:22px;margin-bottom:4px;color:var(--t1)}
.status-line.ok{color:var(--ok)}
.status-line.danger{color:var(--danger)}
.status-line .fin-inline{display:inline-flex;align-items:center;margin-left:10px;height:22px;padding:0 8px;border-radius:5px;font-size:11.5px;font-weight:550;background:var(--sunken);color:var(--t3);vertical-align:middle}
.status-line .fin-inline.on{background:var(--accent-tint);color:var(--accent-text)}
.status-line .fin-inline.paid{background:var(--ok-bg);color:var(--ok)}
.status-line .fin-inline.warn{background:var(--warn-bg);color:var(--warn)}
.status-sub{font-size:13px;color:var(--t3);margin-bottom:var(--sp3);line-height:1.5}
.track{position:relative;display:grid;grid-template-columns:repeat(10,1fr);padding:0 2px}
.track .rail{position:absolute;left:calc(100%/20);right:calc(100%/20);top:10px;height:2.5px;border-radius:2px;background:#E6E6EA}
.track .fill{position:absolute;left:calc(100%/20);top:10px;height:2.5px;border-radius:2px;background:var(--ok);transition:width .4s ease}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;z-index:1}
.dot2{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #D6D6DC;color:var(--t5);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.stop.d .dot2{background:var(--ok);border-color:var(--ok);color:#fff}
.stop.c .dot2{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px rgba(46,123,229,.12)}
.stop.x .dot2{border-color:var(--danger);color:var(--danger);box-shadow:0 0 0 3px rgba(198,40,40,.1)}
.stop.fn .dot2{border-style:dashed}
.stop.fn.d .dot2,.stop.fn.c .dot2{border-style:solid}
.stop .nm{font-size:13px;font-weight:550;color:var(--t3);margin-top:8px;line-height:18px}
.stop.f .nm{color:var(--t5);font-weight:450}
.stop.c .nm,.stop.x .nm{color:var(--t1);font-weight:650}
.stop .tm{font-size:9.5px;color:var(--t4);margin-top:1px;font-variant-numeric:tabular-nums;min-height:11px}
.stop.c .tm{color:var(--accent-text);font-weight:600}

.gate-inline{margin-top:8px}
.gate-tog{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-radius:var(--r);background:var(--accent-tint);border:1px solid #C5D9F5;cursor:pointer;font:inherit;color:inherit;text-align:left}
.gate-tog:hover{background:#DCE9F9}
.gate-tog .gtag{height:18px;padding:0 7px;border-radius:4px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;flex:none}
.gate-tog .gt{font-size:13px;font-weight:600;color:var(--t1);flex:1}
.gate-tog .gp{font-size:11.5px;color:var(--t3);font-variant-numeric:tabular-nums;white-space:nowrap}
.gate-tog .gp b{color:var(--accent-text);font-weight:650}
.gate-tog .car{font-size:10px;color:var(--t4);flex:none;transition:transform .15s}
.gate-tog.open .car{transform:rotate(180deg)}
.gate{margin-top:6px;border-radius:var(--r);background:#fff;box-shadow:var(--gate-sh);overflow:hidden;display:none;border:1px solid #B8D0F0}
.gate.open{display:block}
.rev{padding:13px 14px 8px}
.rev-ai{font-size:14px;line-height:1.5;color:var(--t2);background:#FFF8F7;border-radius:8px;padding:10px 13px;margin-bottom:13px}
.rev-ai b{color:var(--danger);font-weight:650}
.src-row{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px}
.src{border:1px solid var(--line);border-radius:8px;background:var(--sunken);padding:13px;min-width:0}
.src b{display:block;font-size:14px;font-weight:650;color:var(--t1)}
.src .fn{font-size:13px;color:var(--accent-text);margin-top:2px}
.src pre{margin-top:8px;font-family:var(--font-id);font-size:13px;line-height:1.45;color:var(--t2);white-space:pre-wrap}
.rev-sec{margin-top:13px}
.rev-sec h3{font-size:14px;font-weight:650;color:var(--t1);margin-bottom:8px}
.rev-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
@media (max-width:1360px){.rev-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rev-grid .span2{grid-column:span 2}
.rev-grid .spanall{grid-column:1 / -1}
.rev .fv > span{font-size:13px;font-weight:600;color:var(--t3);display:flex;align-items:center;gap:6px}
.rev .gfoot{flex-wrap:wrap;align-items:flex-end}
.rev .btn,.rev .btn.sm{font-size:14px;height:34px}
.rev .gfoot .nx{font-size:13px}
.rev .req{color:var(--danger);font-style:normal;font-weight:650;font-size:13px}
.rev .fv input,.rev .fv select,.rev .fv textarea{font-size:14px;width:100%}
.rev .fv textarea{height:64px;padding:8px 9px;resize:vertical}
.rev .fv.bad input,.rev .fv.bad select,.rev .fv.bad textarea{border-color:var(--danger);background:#FFF8F8}
.hint-bad{font-size:13px;color:var(--danger);line-height:1.4;margin-top:3px}
.svc{display:flex;flex-wrap:wrap;gap:8px 13px}
.rev .svc label{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--t1)}
.tariffs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tariffs input{width:180px;height:32px;padding:0 9px;border-radius:6px;border:1px solid var(--line);font-size:14px}
.tn .bd{min-width:0}
.grule{padding:10px 14px;font-size:13px;color:var(--t3);background:#FAFBFE;border-bottom:1px solid var(--line-soft);line-height:1.5}
.grule b{color:var(--t2);font-weight:600}
.gfields{padding:var(--sp2) 14px;display:grid;grid-template-columns:1fr 1fr;gap:var(--sp2)}
.gfields .fv.wide{grid-column:1/-1}
.fv{display:flex;flex-direction:column;gap:3px}
.fv label{font-size:12px;font-weight:600;color:var(--t3);display:flex;align-items:center;gap:6px}
.fv label .req{color:var(--danger)}
.fv label .tt{font-size:10px;font-weight:500;color:var(--t5);background:var(--sunken);padding:0 4px;border-radius:3px;height:14px;line-height:14px}
.fv input,.fv select{height:32px;padding:0 9px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;font-size:13px;color:var(--t1);outline:none}
.fv input:focus,.fv select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,123,229,.12)}
.fv.err input,.fv.err select{border-color:var(--danger);background:#FFF8F8}
.fv .file-row{display:flex;gap:6px;align-items:center}
.fv .file-row input{flex:1}
.fv .file-row .btn{flex:none}
.gwarn{margin:0 14px 8px;padding:8px 10px;border-radius:var(--r-sm);font-size:12px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.gwarn.exc,.gwarn.fh{background:var(--danger-bg);color:var(--danger)}
.gfoot{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#FAFBFE;border-top:1px solid var(--line-soft)}
.gfoot .nx{flex:1;font-size:11.5px;color:var(--t4);line-height:1.4}
.gfoot .nx b{color:var(--t2)}
.gfoot .btn.primary{height:34px;padding:0 16px;font-size:13.5px;font-weight:650;border-radius:var(--r)}

.op-line{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-card);padding:var(--sp3) var(--sp3) var(--sp2);margin-bottom:var(--sp2)}
.fv.st-empty input,.fv.st-empty select{border-style:dashed}
.fv.st-human input,.fv.st-human select{border-style:solid;border-color:#B7D7A8;background:#F6FBF6}
.fv.st-suggest{background:#FFF8E8;border-radius:8px}
.fv.st-suggest input,.fv.st-suggest select{border-style:solid;border-color:#E0B44A;background:#FFFDF6}
.ai-state{font-style:normal;font-weight:650;font-size:13px;margin-left:6px}
.fv.st-empty .ai-state{color:#5C6370}
.fv.st-human .ai-state{color:#1F7A1A}
.fv.st-suggest .ai-state{color:#8A5A00}
.ai-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.ai-val{font-size:14px;font-weight:650;color:#8A5A00}
#aiLoc{margin-top:8px;padding:8px 10px;border-radius:8px;background:#FFF8E8;font-size:14px}
#aiLog{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.5}
.op-line .trk-embed{margin:0 0 6px;padding:0;box-shadow:none;background:transparent;border-radius:0}
.tl{padding:8px 0 12px;border-top:1px solid var(--line-soft);margin-top:var(--sp2)}
.card-h{display:none}
.tn{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding:8px 0}
.tn::before{content:"";position:absolute;left:10px;top:30px;bottom:-8px;width:1.5px;background:#E6E6EA}
.tn:last-child::before{display:none}
.tn.d::before{background:var(--ok)}
.tn .ix{width:22px;height:22px;border-radius:50%;border:2px solid #D6D6DC;background:#fff;color:var(--t5);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.tn.d .ix{background:var(--ok);border-color:var(--ok);color:#fff}
.tn.c .ix{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px rgba(46,123,229,.1)}
.tn.x .ix{border-color:var(--danger);color:var(--danger)}
.tn.fn .ix{border-style:dashed}
.tn.fn.d .ix,.tn.fn.c .ix{border-style:solid}
.tn .bd > b{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;line-height:20px}
.tn .bd p{font-size:13px;color:var(--t4);margin-top:2px;line-height:18px}
.tn.f .bd > b{color:var(--t5);font-weight:500}
.tn.d .sum{font-size:11px;color:var(--t4);display:flex;gap:8px;align-items:center;margin-top:1px}
.tn.d .sum .done-at{color:var(--ok);font-weight:600;font-variant-numeric:tabular-nums}
.tn.c,.tn.x{background:linear-gradient(90deg,rgba(46,123,229,.04),transparent 70%);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:var(--r)}
.tn.x{background:linear-gradient(90deg,rgba(198,40,40,.04),transparent 70%)}
.tn.c .hint,.tn.x .hint{font-size:12px;color:var(--t3);margin-top:2px}
.auto{display:inline-flex;align-items:center;height:15px;padding:0 5px;border-radius:3px;background:var(--accent-tint);color:var(--accent-text);font-size:10px;font-weight:600}
.ai-tip{margin-top:8px;padding:10px 12px;border-radius:var(--r-sm);background:#F7F9FC;font-size:13px;color:var(--t3);line-height:1.5}
.ai-tip b{color:var(--accent-text);font-weight:650;margin-right:4px}
.meta-foot{margin-top:var(--sp3);padding-top:var(--sp2);border-top:1px solid var(--line-soft);font-size:13px;color:var(--t4);display:flex;flex-wrap:wrap;gap:8px 16px;line-height:1.5}
.meta-foot b{color:var(--t2);font-weight:500}
.scheme-note{margin-top:var(--sp4);padding-top:var(--sp2);border-top:1px solid var(--line-soft);font-size:13px;color:var(--t4);line-height:1.65}
.toast{position:fixed;right:24px;bottom:24px;background:#1A1D23;color:#fff;font-size:13px;padding:10px 14px;border-radius:var(--r);opacity:0;transform:translateY(8px);transition:all .25s;z-index:50;max-width:360px}
.toast.on{opacity:1;transform:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:30px;padding:0 11px;border-radius:var(--r-sm);border:1px solid transparent;font-size:12.5px;font-weight:500;cursor:pointer;background:transparent;white-space:nowrap;font:inherit;color:inherit}
.btn.sm{height:26px;padding:0 9px;font-size:12px;border-radius:5px}
.btn.primary{background:var(--qb-green);color:#fff;border:0}
.btn.primary:hover{background:var(--qb-green-dark)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.secondary{background:var(--surface);border:1px solid var(--line);color:var(--t2);box-shadow:var(--sh)}
.btn.ghost{color:var(--t3);border:0;background:transparent}
.btn.ghost:hover{background:var(--sunken);color:var(--t2)}
.cotag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--t2)}
.cotag i{width:7px;height:7px;border-radius:2px;flex:none}
.dt-empty{padding:80px 24px;text-align:center;color:var(--t4);font-size:14px}
.tn .bd .gate-tog .gp b{display:inline;font-size:inherit;line-height:inherit}

/* 今日进度环 */
.ring-chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px 0 5px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 1px var(--line-soft);border:0;font:inherit;color:inherit;cursor:pointer;transition:background .2s,box-shadow .2s}
.ring-chip:hover{background:var(--sunken)}
.ring-chip svg{width:20px;height:20px;transform:rotate(-90deg);flex:none}
.ring-chip .bg{fill:none;stroke:#E8E8EE;stroke-width:2.6}
.ring-chip .fg{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.3,.7,.2,1),stroke .3s}
.ring-chip .rl{font-size:11px;color:var(--t4);font-weight:500}
.ring-chip .rn{font-size:12px;font-weight:650;color:var(--t1);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ring-chip .rn small{font-size:11px;color:var(--t4);font-weight:500}
.ring-chip.clear{background:var(--ok-bg);box-shadow:0 0 0 1px #BFE5C8}
.ring-chip.clear .fg{stroke:var(--ok)}
.ring-chip.clear .rn,.ring-chip.clear .rl{color:var(--ok)}
.ring-chip.bump{animation:ringBump .55s ease}
@keyframes ringBump{0%{transform:scale(1)}35%{transform:scale(1.08)}100%{transform:scale(1)}}

.side-tog{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 6px;border-radius:var(--r-sm);color:var(--t3);margin-left:-6px;font-size:12px;font-weight:550;border:1px solid transparent}
.side-tog svg{width:17px;height:17px;flex:none}
.side-tog .side-tog-label{display:none;line-height:1;white-space:nowrap}
.app.collapsed .side-tog{color:var(--accent-text);background:var(--accent-tint);border-color:#C5D9F5;padding-right:10px}
.app.collapsed .side-tog .side-tog-label{display:inline}
.side-tog:hover{background:var(--sunken);color:var(--t1)}
.app.collapsed .side-tog:hover{background:#DCE9F9;color:var(--accent-text)}
.app.collapsed .dt{max-width:none;padding-left:var(--sp4);padding-right:var(--sp4)}
.app.collapsed .gfields{grid-template-columns:1fr 1fr 1fr}
.collapsed-hint{display:none;font-size:11.5px;color:var(--t4);margin-left:2px;white-space:nowrap}
.app.collapsed .collapsed-hint{display:inline}

/* hide unused BASE leftovers that conflict */
.page-clean{display:none}
.list-pane{display:none !important}

/* v1.3.15 深炭侧栏里的柜号行：浅字、选中绿条、短标签可读 */
.rail .vhead{flex:none;padding:6px 8px 0}
.rail .vbody,.rail #tree{flex:none;min-height:0;display:flex;flex-direction:column}
.rail .cab-scroll{flex:none;min-height:0;overflow:visible;padding:2px 4px 8px;scrollbar-width:thin}
.rail .nav-search{background:rgba(255,255,255,.06);color:#C8CDD6;border-color:transparent;margin-bottom:8px;height:36px;font-size:13px}
.rail .nav-search:focus-within{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);box-shadow:none}
.rail .nav-search input{color:#fff}
.rail .nav-search input::placeholder{color:#8B929E}
.rail .nav-search .kbd{background:transparent;border-color:rgba(255,255,255,.14);color:#8B929E}
.rail .today-strip{gap:4px;margin-bottom:6px}
.rail .tchip{background:rgba(255,255,255,.06);color:#E8EAEE;height:32px;padding:0 8px}
.rail .tchip:hover{background:rgba(255,255,255,.1)}
.rail .tchip.on{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.rail .tchip .tl{color:#8B929E;font-size:12px}
.rail .tchip .tn{color:#fff;font-size:14px}
.rail .tchip.work .tn{color:#9EC0FF}
.rail .tchip.due{background:rgba(196,122,0,.16)}
.rail .tchip.due .tn{color:#FFD591}
.rail .tchip.due.on{box-shadow:inset 0 0 0 1px rgba(255,211,141,.45)}
.rail .tchip.exc{background:rgba(198,40,40,.18)}
.rail .tchip.exc .tn{color:#FFB4B4}
.rail .tchip.exc.on{box-shadow:inset 0 0 0 1px rgba(255,180,180,.4)}
.rail .tchip.zero .tn{color:#6E7682}
.rail .list-tools{height:auto;min-height:36px;flex-wrap:wrap;gap:8px;margin:0 0 8px;padding:8px 2px 0;border-top:1px solid rgba(255,255,255,.08)}
.rail .list-tools .lt-l{color:#9AA3B2;font-size:12px}
.rail .list-tools .lt-l.on{color:#fff}
.rail .tbtn{background:transparent;border-color:rgba(255,255,255,.16);color:#C8CDD6;height:28px;font-size:13px;padding:0 8px}
.rail .tbtn:hover:not(:disabled){background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28);color:#fff}
.rail .tbtn.on{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.rail .cab{grid-template-columns:14px minmax(0,1fr) auto;column-gap:8px;padding:8px 8px 8px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#E8EAEE;align-items:center}
.rail .cab:hover{background:rgba(255,255,255,.05)}
.rail .cab.on{background:rgba(255,255,255,.12);border-bottom-color:transparent}
.rail .cab.on::before{background:var(--qb-green);width:3px;top:5px;bottom:5px}
.rail .cab .cid{color:#F2F4F7;font-size:13px;min-width:0;line-height:20px}
.rail .cab .cdot{width:7px;height:7px}
.rail .cab.on .cid{color:#fff}
.rail .cab .ck{border-color:rgba(255,255,255,.38);background:transparent;opacity:.5;margin-top:0}
.rail .cab:hover .ck,.rail .cab .ck.on{opacity:1}
.rail .cab.sel{background:rgba(46,123,229,.18)}
.rail .cab.sel.on{background:rgba(255,255,255,.12)}
.rail .cside{display:inline-flex;align-items:center;gap:6px;min-width:0}
.rail .rhint{font-family:var(--font-id);font-size:12px;font-weight:550;color:#9AA3B2;font-variant-numeric:tabular-nums;white-space:nowrap}
.rail .cab .cmeta{background:rgba(255,255,255,.1);color:#E8EAEE;height:22px;padding:0 7px;margin-top:0;font-size:12px}
.rail .cab .cmeta.hot{background:rgba(198,40,40,.42);color:#FFD6D6}
.rail .cab .cmeta.due{background:rgba(196,122,0,.34);color:#FFE3B0}
.rail .cab .cmeta.fin,.rail .cab .cmeta.done{background:rgba(44,160,28,.28);color:#C8F0C0}
.rail .cab .sub2,.rail .cab .do,.rail .cab .due-line{color:#A8B0BC}
.rail .cab .do.hot{color:#FFB4B4}
.rail .cab .do.due{color:#FFD591}
.rail .cab-empty{color:#8B929E;padding:10px 8px;font-size:13px}
.rail .sec-lab{display:flex;align-items:center;gap:8px;height:28px;margin:10px 8px 4px;font-size:12px;font-weight:650;letter-spacing:.04em;color:#8B929E}
.rail .sec-lab::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.12)}
.rail .sec-lab span{font-variant-numeric:tabular-nums}
.rail .sec-lab.done{color:#8FCB86;margin-top:10px}
.rail .done-grp{border-top-color:rgba(255,255,255,.1)}
.rail .done-tog{color:#8FCB86}
.rail .done-tog:hover{background:rgba(255,255,255,.05)}
/* 全部：顶上排序 + 阶段色块筛选；下面一张平铺柜号，柜号旁边是当前阶段 */
.rail .all-sort{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 8px}
.rail .all-sort button{height:32px;border-radius:6px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#E8EAEE;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.rail .all-sort button.on{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.rail .flab{font-size:12px;font-weight:650;color:#8B929E;letter-spacing:.04em;margin:8px 2px 4px}
.rail .fchips{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 4px}
.rail .fchip{height:32px;padding:0 10px;border-radius:6px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#E8EAEE;font:inherit;font-size:13px;cursor:pointer}
.rail .fchip.on{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.rail .fclear{margin-top:8px}
.rail .grp-h{display:flex;align-items:center;gap:8px;width:100%;height:36px;margin:10px 0 2px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:#9AA3B2;font:inherit;font-size:13px;font-weight:650;cursor:pointer;text-align:left}
.rail .grp-h:hover{background:rgba(255,255,255,.05);color:#fff}
.rail .grp-h .car{font-size:10px;width:10px;transition:transform .15s}
.rail .grp-h.fold .car{transform:rotate(-90deg)}
.rail .grp-h .gc{margin-left:auto;min-width:18px;height:18px;padding:0 6px;border-radius:9px;background:rgba(255,255,255,.1);color:#E8EAEE;font-size:12px;font-weight:650;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.rail .grp-h.done{color:#8FCB86;margin-top:14px}
.rail .grp-h.done .gc{background:rgba(44,160,28,.28);color:#C8F0C0}
.rail .stage-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.rail .stage-chip{display:inline-flex;align-items:center;height:28px;padding:0 8px;border-radius:6px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#E8EAEE;font:inherit;font-size:13px;line-height:28px;cursor:pointer;white-space:nowrap}
.rail .stage-chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sc);margin-right:6px;flex:none}
.rail .stage-chip.on{color:#fff;border-color:transparent;font-weight:650;background:var(--sc)}
.rail .stage-chip.on::before{background:#fff}
.rail .cab.allrow{grid-template-columns:14px auto auto auto;justify-content:start;align-items:center;column-gap:8px;padding:6px 8px 6px 10px}
.rail .stage{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:4px;font-size:13px;font-weight:650;line-height:24px;color:#fff;white-space:nowrap}
.rail .stage.s-new{background:#2F6FED}
.rail .stage.s-sea{background:#0E7C86}
.rail .stage.s-term{background:#B86E00}
.rail .stage.s-wh{background:#6B46C1}
.rail .stage.s-out{background:#C4551A}
.rail .stage.s-xb{background:#B4236A}
.rail .stage.s-del{background:#0E7A47}
.rail .stage.s-done{background:#5C6570}
.rail .hav{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.rail .nest-foot{flex:none;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#8B929E;font-variant-numeric:tabular-nums}
.rail .nest-foot b{color:#E8EAEE;font-weight:600}
.rail .nest-foot .sp{flex:1}
.rail .filt-body{border-left-color:rgba(255,255,255,.12);margin-bottom:4px}
.rail .sort-h,.rail .auto-sort{color:#8B929E}
.rail .auto-sort{font-size:12px;padding:4px 4px 8px;line-height:1.45}
.rail .si,.rail .rd{color:#C8CDD6}
.rail .si:hover,.rail .rd:hover{background:rgba(255,255,255,.06);color:#fff}
.rail .si.on,.rail .rd.on{background:rgba(255,255,255,.1);color:#fff}
.rail .si .ct{color:#9AA3B2}
.rail .si .stepn{background:rgba(255,255,255,.08);color:#C8CDD6}
.rail-top,.nav-foot{position:relative}
.pop{display:none;position:absolute;z-index:40;left:8px;right:8px;background:#fff;color:var(--t1);border-radius:8px;padding:6px;box-shadow:0 0 0 1px rgba(20,20,30,.08),0 12px 28px rgba(0,0,0,.2)}
.pop.open{display:block}
.co-pop{top:100%;margin-top:4px}
.role-pop{top:auto;bottom:100%;margin-bottom:4px}
.pop button{display:flex;align-items:center;width:100%;height:36px;padding:0 12px;border:0;border-radius:6px;background:transparent;font:inherit;font-size:13px;color:var(--t1);cursor:pointer;text-align:left}
.pop button:hover{background:var(--sunken)}
.pop button.on{background:var(--accent-tint);color:var(--accent-text);font-weight:650}
.me{cursor:pointer;border-radius:8px}
.me:hover{background:rgba(255,255,255,.06)}

/* 工作台：同一份样张的 #/workbench。侧栏收回平台导航，右边整页是今天要处理的柜。 */
.app.page-work{grid-template-columns:var(--nav-plat) minmax(0,1fr)}
.app.page-work .order-nest{display:none !important}
.wb-lead{font-size:14px;color:var(--t3);margin:-8px 0 21px;line-height:1.5}
.wb-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:21px}
.wb-stat{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-card);padding:16px 18px;min-height:84px}
.wb-stat .k{display:block;font-size:12px;font-weight:650;color:var(--t4);letter-spacing:.04em;margin-bottom:6px}
.wb-stat .v{display:block;font-size:28px;font-weight:700;line-height:34px;font-variant-numeric:tabular-nums;color:var(--t1)}
.wb-stat.due .v{color:var(--warn)}
.wb-stat.exc .v{color:var(--danger)}
.wb-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-card);padding:8px 21px 13px}
.wb-sec{display:flex;align-items:center;gap:8px;height:36px;margin-top:8px;font-size:12px;font-weight:650;letter-spacing:.04em;color:var(--t4)}
.wb-sec span{font-variant-numeric:tabular-nums}
.wb-row{display:grid;grid-template-columns:148px 96px minmax(0,1fr) auto;gap:13px;align-items:center;min-height:52px;padding:8px 4px;border-top:1px solid var(--line-soft);color:inherit;text-decoration:none}
.wb-row:hover{background:var(--sunken);margin:0 -8px;padding-left:12px;padding-right:12px;border-radius:8px}
.wb-row .cid{font-size:14px}
.wb-node{font-size:13px;color:var(--t2);font-weight:600}
.wb-why{font-size:13px;color:var(--t3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb-side{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.wb-co{font-size:13px;color:var(--t2);white-space:nowrap}
.wb-side .cmeta{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:12px;font-weight:650;white-space:nowrap;background:var(--accent-tint);color:var(--accent-text)}
.wb-side .cmeta.hot{background:var(--danger-bg);color:var(--danger)}
.wb-side .cmeta.due{background:var(--warn-bg);color:var(--warn)}
.wb-side .cmeta.fin,.wb-side .cmeta.done{background:var(--ok-bg);color:var(--ok)}
.wb-empty{padding:28px 8px;font-size:14px;color:var(--t4)}

/* 到仓拆柜 · 拆柜清单（沿用审核表的四列节奏） */
.tn .bd{min-width:0}
.op-line,.tl{min-width:0}
#unloadForm{min-width:0}
#unloadForm .fv{min-width:0}
#unloadForm .en{font-style:normal;font-weight:500;color:var(--t5);font-size:12px}
#unloadForm .file-row{display:flex;gap:6px;align-items:center;min-width:0}
#unloadForm .file-row input{flex:1;width:auto;min-width:0}
#unloadForm .fv.gate input{border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,123,229,.12)}
#unloadForm .fv.short input{border-color:var(--danger);background:#FFF8F8}
#unloadForm .fv.over input{border-color:#C47A00;background:#FFF8EB}
#unloadForm input[readonly]{background:var(--sunken);color:var(--t2)}
.ul-var{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 13px;margin:0 0 8px;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:650}
.ul-var b{font-size:16px;font-variant-numeric:tabular-nums}
.ul-var small{font-weight:500;font-size:13px}
.ul-var.short{background:#FDEDED;color:#C62828}
.ul-var.over{background:#FFF8EB;color:#B86E00}
.ul-var.even{background:#E8F6E8;color:#0E7A47}
.split-block{margin-top:13px;padding-top:13px;border-top:1px solid var(--line-soft)}
.split-block h4{font-size:13px;font-weight:650;margin-bottom:4px}
.split-block p{font-size:13px;color:var(--t3);margin-bottom:8px}
.box-list{display:flex;flex-direction:column;gap:8px}
.box-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(72px,.5fr) auto;gap:8px;align-items:center}
.box-row input{height:32px;padding:0 9px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:13px;width:100%;min-width:0}
.box-row input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(46,123,229,.12)}
.pl-tools{display:flex;gap:8px;align-items:stretch;margin-top:8px}
.pl-tools textarea{flex:1;min-width:0;min-height:72px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px/1.45 var(--font-id);resize:vertical;background:#fff}
.pl-tools textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(46,123,229,.12)}
.pl-wrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:8px;margin-top:8px}
.pl{width:100%;border-collapse:collapse;min-width:920px;font-size:13px}
.pl th{text-align:left;font-size:12px;font-weight:600;color:var(--t3);height:36px;padding:0 8px;background:#FAFAFB;border-bottom:1px solid var(--line);white-space:nowrap}
.pl td{padding:4px 6px;border-bottom:1px solid var(--row-line);vertical-align:middle}
.pl input{height:30px;width:100%;min-width:64px;padding:0 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff}
.pl input.hs{min-width:112px;font-family:var(--font-id)}
.pl input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(46,123,229,.12)}
.pl tfoot td{background:#FAFAFB;font-weight:650;font-variant-numeric:tabular-nums;height:40px;padding:0 8px}
.pl tfoot tr.short td{background:#FDEDED;color:#C62828}
.pl tfoot tr.over td{background:#FFF8EB;color:#B86E00}
.pl tfoot tr.even td{background:#E8F6E8;color:#0E7A47}
.pl .r{text-align:right}
@media (max-width:1360px){
  .box-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 72px auto}
}

const TODAY_IDS = new Set(DATA.filter(c => (c.d < N && !NODES[c.d].fin) || c.dt).map(c => c.id));
function inToday(c){ return TODAY_IDS.has(c.id); }
function todayTotal(){ return TODAY_IDS.size; }
function todayDone(){ return DATA.filter(c => inToday(c) && c.dt).length; }
function nowHM(){ const t = new Date(); const p = x => String(x).padStart(2,'0'); return p(t.getHours())+':'+p(t.getMinutes()); }
function markDone(c, from){
  if (!inToday(c) || c.dt) return false;
  c.dt = nowHM(); c.dtFrom = from; state.ringBump = true; return true;
}
function progressSuffix(){
  const d = todayDone(), t = todayTotal();
  return d>=t ? ' · 今日已清 ✓' : ' · 今日 '+d+'/'+t;
}
function renderRing(){
  const el = $('#ring'); if (!el) return;
  const d = todayDone(), t = todayTotal(), pct = t ? d/t : 0;
  const C = 2*Math.PI*8;
  const clear = t>0 && d>=t;

  el.title = clear ? '今日已清：今天 '+t+' 个柜的当前节点都推进完了' : '今日进度：已推进 '+d+' / 今日该处理 '+t+' 柜（点一下看剩下的）';

function isTodo(c){ return c.d < N && !NODES[c.d].fin; }
function isActive(c){ return c.d < N; }
function lfdLive(c){ return c.lfd && c.d <= 4; }
function etaLive(c){ return c.eta && c.eta!=='已送达' && c.d <= 3; }
function isDueToday(c){
  if (!isActive(c)) return false;
  if (lfdLive(c)){ const d = daysFrom(c.lfd); if (d!==null && d<=0) return true; }
  if (etaLive(c)){ const d = daysFrom(c.eta); if (d!==null && d===0) return true; }
  if (c.eta==='今天') return true;
  return false;
}
function leftFields(c){
  const key = NODES[c.d]?.k; const G = GATES[key];
  if (!G) return [];
  return G.f.filter(f => !f.opt && !c.v[f.k]);
}
function todayDo(c){
  if (c.exc) return {txt:'先处理异常 · '+(c.exc.split(' · ')[0]), cls:'hot'};
  if (c.fh) return {txt:'财控暂停 · 联系财务后才能派送', cls:'hot'};
  if (c.d===0) return {txt:'今天审核这柜 · 看单证后点通过', cls:''};
  const miss = leftFields(c);
  const node = NODES[c.d]?.n || '';
  const short = node.replace('完成','').replace('申报','');
  if (lfdLive(c)){
    const d = daysFrom(c.lfd);
    if (d!==null && d<0) return {txt:'LFD 已逾期 · 尽快提柜', cls:'hot'};
    if (d===0){
      const need = miss.length ? ' · 还差 '+(miss.map(f=>f.l.replace(/货柜 |提柜 |完成/g,'')).slice(0,2).join(' / ')) : '';
      return {txt:'今天提柜 · LFD 今天到期'+need, cls:'due'};
    }
  }
  if (etaLive(c) || c.eta==='今天'){
    const d = c.eta==='今天' ? 0 : daysFrom(c.eta);
    if (d===0) return {txt:'今天到港 / ETA 今天 · 确认转关', cls:'due'};
  }
  if (c.insp) return {txt:'查验中 · 节点照常走 · '+short, cls:''};
  if (c.doc) return {txt:'文件待补 · '+c.doc.split('：')[0].slice(0,14), cls:''};
  if (miss.length){
    const names = miss.map(f=>f.l.replace(/货柜 |提柜 |完成|日期|（.*?）/g,'')).filter(Boolean).slice(0,2);
    return {txt:'今天'+short+' · 还差 '+names.join(' / '), cls:''};
  }
  if (NODES[c.d]?.fin) return {txt:'财务节点 · 本页只读', cls:''};
  return {txt:'今天'+short+' · 门闩已齐，可保存推进', cls:''};
}
function daysFrom(s){
  if (!s || s==='已送达' || s==='今天') return s==='今天' ? 0 : null;
  const [m,d] = s.split('/').map(Number);
  if (!m) return null;
  return Math.round((new Date(2026, m-1, d) - TODAY) / 864e5);
}
function stateOf(c){
  if (c.d >= N) return {k:'已回款', cls:'ok', txt:'已回款'};
  if (c.exc) return {k:'异常', cls:'danger', txt:'异常 · ' + NODES[c.d].n};
  if (c.d === N-1) return {k:'催款中', cls:'warn', txt:'催款中'};
  if (c.fh) return {k:'进行中', cls:'danger', txt:'财控暂停'};
  return {k:'进行中', cls:'info', txt: NODES[c.d].n};
}

function dueLine(c){
  const bits = [];
  if (lfdLive(c) && c.lfd){
    const d = daysFrom(c.lfd);
    let cls = '';
    let lab = 'LFD '+c.lfd;
    if (d!==null && d<0){ cls='hot'; lab='LFD 逾期'; }
    else if (d===0){ cls='hot'; lab='LFD 今天'; }
    else if (d!==null && d<=2){ cls='soon'; }
    bits.push('<span class="'+cls+'">'+lab+'</span>');
  }
  if (c.eta && c.eta!=='已送达'){
    const d = c.eta==='今天' ? 0 : daysFrom(c.eta);
    let cls = '';
    let lab = 'ETA '+c.eta;
    if (d===0){ cls='hot'; lab='ETA 今天'; }
    else if (d!==null && d<=2){ cls='soon'; }
    bits.push('<span class="'+cls+'">'+lab+'</span>');
  }
  return bits.length ? '<div class="due-line">'+bits.join(' · ')+'</div>' : '';
}
function stamp(ci, i){
  const base = new Date(2026, 8, 22 + (ci % 5));
  const t = new Date(base.getTime() + i * 86400000 * 1.1 + ((ci*7+i*3)%9) * 3600000);
  const p = (x)=>String(x).padStart(2,'0');
  return p(t.getMonth()+1) + '/' + p(t.getDate()) + ' ' + p(8 + (ci+i*5)%10) + ':' + p((ci*13+i*17)%60);
}

  if (!q) return true;
  return [c.id,c.cc,c.ord,c.mbl,c.cu,c.co].join(' ').toLowerCase().includes(q);
}
/* 已完成 = 签收之后（催款回款 / 已回款）。进行中含中途的财务开票。 */
function isDoneOrder(c){ return c.d >= N - 1; }
/* 十个节点 → 阶段。已完成（催款 / 已回款）单独一色。全部是平铺，不按阶段分组。 */
const GROUPS = [
  {id:'new', n:'新增订单', ds:[0,1], color:'#2F6FED'},
  {id:'sea', n:'海上订单', ds:[2], color:'#0E7C86'},
  {id:'term', n:'码头订单', ds:[3,4], color:'#B86E00'},
  {id:'wh', n:'仓库订单', ds:[5], color:'#6B46C1'},
  {id:'out', n:'出仓订单', ds:[6], color:'#C4551A'},
  {id:'xb', n:'过境运输', ds:[7], color:'#B4236A'},
  {id:'del', n:'派送订单', ds:[8], color:'#0E7A47'},
];
const STAGES = GROUPS.concat([{id:'done', n:'已完成', color:'#5C6570'}]);
function stageOf(c){
  if (isDoneOrder(c)) return {id:'done', n:'已完成'};
  for (let i=0;i<GROUPS.length;i++) if (GROUPS[i].ds.indexOf(c.d)>=0) return GROUPS[i];
  return GROUPS[0];
}
function handlerOf(c){
  if (c.d >= N) return '王芳';
  return (NODES[c.d] && NODES[c.d].who) || '';
}
function initialOf(name){
  const ch = (name||'?').trim().charAt(0);
  return /[A-Za-z]/.test(ch) ? ch.toUpperCase() : ch;
}
function matchAll(c){
  if (state.allExc && !c.exc) return false;
  if (state.allWho && handlerOf(c)!==state.allWho) return false;
  if (state.allCc && c.cc!==state.allCc) return false;
  if (state.allStage && stageOf(c).id!==state.allStage) return false;
  return true;
}
function allFiltering(){ return !!(state.allStage || state.allWho || state.allCc || state.allExc); }
function stageRank(c){
  const i = STAGES.findIndex(s => s.id===stageOf(c).id);
  return i<0 ? 99 : i;
}
function cmpAll(a,b){
  const num = v => (v===null || v===undefined) ? 1e9 : v;
  const etaD = c => c.eta==='今天' ? 0 : daysFrom(c.eta);
  const byDate = () => {
    if (isDoneOrder(a) && isDoneOrder(b)) return doneAt(b)-doneAt(a);
    return num(keyDays(a)) - num(keyDays(b));
  };
  let d = 0;
  if (state.allSort==='status') d = stageRank(a) - stageRank(b) || byDate();
  else if (state.allSort==='eta') d = num(etaD(a)) - num(etaD(b));
  else if (state.allSort==='lfd') d = num(daysFrom(a.lfd)) - num(daysFrom(b.lfd));
  else d = byDate();
  if (d) return d;
  if (a.d!==b.d) return a.d-b.d;
  return a.id<b.id ? -1 : 1;
}
function keyDays(c){
  const cands = [];
  if (c.d <= 4 && c.lfd){ const d = daysFrom(c.lfd); if (d!==null) cands.push(d); }
  if (c.eta && c.eta!=='已送达'){ const d = c.eta==='今天' ? 0 : daysFrom(c.eta); if (d!==null) cands.push(d); }
  return cands.length ? Math.min.apply(null, cands) : null;
}
function keyDateLabel(c){
  let bestD = Infinity, label = '';
  if (c.d <= 4 && c.lfd){ const d = daysFrom(c.lfd); if (d!==null && d < bestD){ bestD = d; label = c.lfd; } }
  if (c.eta && c.eta!=='已送达'){ const d = c.eta==='今天' ? 0 : daysFrom(c.eta); if (d!==null && d < bestD){ bestD = d; label = c.eta==='今天' ? '今天' : c.eta; } }
  return label;
}
function doneAt(c){
  const ci = DATA.indexOf(c), i = 8; /* 派送签收那一格的演示时间 */
  const base = new Date(2026, 8, 22 + (ci % 5));
  return base.getTime() + i * 86400000 * 1.1 + ((ci*7+i*3)%9) * 3600000;
}
function fmtMD(ms){
  const t = new Date(ms), p = x => String(x).padStart(2,'0');
  return p(t.getMonth()+1)+'/'+p(t.getDate());
}
function sortAll(a,b){
  const da = isDoneOrder(a)?1:0, db = isDoneOrder(b)?1:0;
  if (da !== db) return da - db;
  if (!da){
    const ka = keyDays(a), kb = keyDays(b);
    if ((ka===null) !== (kb===null)) return ka===null ? 1 : -1;
    if (ka!==null && ka !== kb) return ka - kb;
    if (a.d !== b.d) return a.d - b.d;
  } else {
    const dt = doneAt(b) - doneAt(a);
    if (dt) return dt;
  }
  return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
}
function scoped(){
  let rows = state.view==='todo' ? DATA.filter(isTodo) : DATA.slice();
  if (state.filter && FILTERS[state.filter]) rows = rows.filter(FILTERS[state.filter]);
  rows = rows.filter(matchQ);
  if (state.coFilter && state.coFilter!=='全部公司') rows = rows.filter(c => c.co===state.coFilter);
  if (state.view==='all') return rows.filter(matchAll);
  return rows.sort(sortFn);
}
function sortFn(a,b){
  const act = c => isActive(c)?0:1;
  const dl = c => {
    const ld = lfdLive(c) ? daysFrom(c.lfd) : 1e9;
    const ed = etaLive(c) ? daysFrom(c.eta) : 1e9;
    return Math.min(ld??1e9, ed??1e9);
  };
  const todoRank = c => {
    if (c.exc) return 0;
    if (isDueToday(c)) return 1;
    if (c.pr==='特急') return 2;
    if (c.pr==='紧急') return 3;
    return 4;
  };
  switch(state.sort){
    case 'lfd': return (lfdLive(a)?(daysFrom(a.lfd)??1e9):1e9) - (lfdLive(b)?(daysFrom(b.lfd)??1e9):1e9) || PRANK[a.pr]-PRANK[b.pr];
    case 'eta': return (etaLive(a)?(daysFrom(a.eta)??1e9):1e9) - (etaLive(b)?(daysFrom(b.eta)??1e9):1e9) || PRANK[a.pr]-PRANK[b.pr];
    case 'upd': return b.d - a.d || PRANK[a.pr]-PRANK[b.pr];
    default:
      if (state.view==='todo') return todoRank(a)-todoRank(b) || PRANK[a.pr]-PRANK[b.pr] || dl(a)-dl(b);
      return act(a)-act(b) || PRANK[a.pr]-PRANK[b.pr] || dl(a)-dl(b);
  }
}

function cabDots(c){
  const bits = [];
  if (c.pr==='特急') bits.push('<span class="cdot urgent" title="特急"></span>');
  else if (c.pr==='紧急') bits.push('<span class="cdot high" title="紧急"></span>');
  if (c.exc) bits.push('<span class="cdot exc" title="异常"></span>');
  if (c.fh) bits.push('<span class="cdot fh" title="财控"></span>');
  if (c.insp) bits.push('<span class="cdot insp" title="查验"></span>');
  if (c.doc) bits.push('<span class="cdot doc" title="文件"></span>');
  return bits.length ? '<span class="cdots">'+bits.join('')+'</span>' : '';
}
function cabMeta(c, done){
  /* 老系统同款：柜号右边一颗状态胶囊（当前节点 / 异常 / 今日截止） */
  if (done) return {txt:'已推进', cls:'done'};
  if (c.d >= N) return {txt:'已回款', cls:'fin'};
  if (c.d === N-1) return {txt:'催款中', cls:'fin'};
  if (c.exc) return {txt:'异常', cls:'hot'};
  if (c.fh) return {txt:'财控暂停', cls:'hot'};
  if (lfdLive(c)){ const d = daysFrom(c.lfd); if (d!==null && d<0) return {txt:'LFD 逾期', cls:'hot'}; if (d===0) return {txt:'LFD 今天', cls:'due'}; }
  if (c.eta==='今天' || (etaLive(c) && daysFrom(c.eta)===0)) return {txt:'ETA 今天', cls:'due'};
  return {txt:NODES[c.d].n, cls:''};
}

  const done = splitDone ? rows.filter(c => c.dt && inToday(c)) : [];

  }
  return h + '</div>';
}

function rv(rev, key, label, opt){
  opt = opt || {};

  const req = opt.req ? ' <i class="req">必填</i>' : '';
  const bad = opt.bad ? '<div class="hint-bad">'+esc(opt.bad)+'</div>' : '';

}

function blankLine(){ return {marks:'', name:'', desc:'', hs:'', ctns:'', qty:'', nw:'', gw:'', cbm:'', pic:''}; }
function blankBox(){ return {trailer:'', seal:'', ctns:''}; }
function ulNum(s){
  const n = parseFloat(String(s??'').replace(/,/g,''));
  return Number.isFinite(n) ? n : 0;
}
function ulFmt(n){
  const v = Math.round(n * 1000) / 1000;
  return String(v);
}
function parseMD(s){
  if (!s || !/^\d{1,2}\/\d{1,2}$/.test(String(s).trim())) return null;
  const [m,d] = String(s).trim().split('/').map(Number);
  return new Date(2026, m-1, d);
}
function cntrDays(u){
  const a = parseMD(u.checkIn), b = parseMD(u.checkOut);
  if (a==null || b==null) return '';
  return String(Math.round((b-a)/864e5));
}

function lineSums(lines){
  const keys = ['ctns','qty','nw','gw','cbm'];
  const out = {};
  keys.forEach(k => { out[k] = (lines||[]).reduce((s,r) => s + ulNum(r[k]), 0); });
  return out;
}
function varianceOf(u){
  const exp = ulNum(u.cartons);
  const sums = lineSums(u.lines);
  const raw = String(u.upCntr??'').trim().replace(/,/g,'');
  const hasAct = raw!=='' && Number.isFinite(parseFloat(raw));
  const act = hasAct ? parseFloat(raw) : sums.ctns;
  const diff = Math.round((act - exp) * 1000) / 1000;
  const kind = diff<0 ? 'short' : diff>0 ? 'over' : 'even';
  const text = diff<0 ? ('少件 '+ulFmt(-diff)) : diff>0 ? ('多件 '+ulFmt(diff)) : '件数齐';
  const basis = hasAct ? ('拆柜 '+ulFmt(act)) : ('明细 '+ulFmt(sums.ctns));
  return {kind, text, diff, exp, act, hasAct, sums, detail:'清单 '+ulFmt(exp)+' · '+basis};
}
function ulField(u, f){
  const val = f.t==='auto' ? cntrDays(u) : (u[f.k] ?? '');
  const gate = f.gate ? ' <i class="req">门闩</i>' : '';
  let ctrl;
  if (f.t==='sel'){
    ctrl = '<select data-uk="'+f.k+'">'+f.o.map(o => '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
  } else if (f.t==='file'){
    ctrl = '<div class="file-row"><input data-uk="'+f.k+'" value="'+esc(val)+'" placeholder="未上传" readonly><button type="button" class="btn secondary sm" data-uup="'+f.k+'">上传</button></div>';
  } else if (f.t==='auto'){
    ctrl = '<input data-uk="'+f.k+'" value="'+esc(val)+'" placeholder="入仓、出仓都有日期才自动算" readonly>';
  } else {
    ctrl = '<input data-uk="'+f.k+'" value="'+esc(val)+'"'+(f.gate?' placeholder="整数，例如 117" inputmode="numeric"':'')+'>';
  }
  return '<label class="fv'+(f.gate?' gate':'')+'" data-f="'+f.k+'"><span>'+esc(f.l)+gate+' <em class="en">'+esc(f.en)+'</em></span>'+ctrl+'</label>';
}

function readUnload(c){
  const u = unloadModel(c);
  document.querySelectorAll('#unloadForm [data-uk]').forEach(el => {
    if (el.dataset.uk==='days') return;
    u[el.dataset.uk] = el.value;
  });
  u.days = cntrDays(u);
  if (document.getElementById('plBody')){
    const lines = [];
    document.querySelectorAll('#unloadForm [data-line-i]').forEach(row => {
      const g = k => row.querySelector('[data-line="'+k+'"]')?.value ?? '';
      lines.push({marks:g('marks'), name:g('name'), desc:g('desc'), hs:g('hs'), ctns:g('ctns'), qty:g('qty'), nw:g('nw'), gw:g('gw'), cbm:g('cbm'), pic:g('pic')});
    });
    u.lines = lines;
  }
  if (document.getElementById('boxList')){
    const boxes = [];
    document.querySelectorAll('#unloadForm [data-box-i]').forEach(row => {
      const g = k => row.querySelector('[data-box="'+k+'"]')?.value ?? '';
      boxes.push({trailer:g('trailer'), seal:g('seal'), ctns:g('ctns')});
    });
    u.boxes = boxes;
  }
  if (document.getElementById('cabList')){
    u.mergeCabs = [...document.querySelectorAll('#unloadForm [data-cab-i]')].map(row => row.querySelector('[data-cab]')?.value ?? '');
  }
  const mt = document.querySelector('#unloadForm [data-merge-trailer]');
  if (mt) u.mergeTrailer = mt.value;
  const act = String(u.upCntr||'').trim();
  if (act) c.v.upCntr = act; else delete c.v.upCntr;
  return u;
}

  const v = varianceOf(u);
  const banner = document.getElementById('ulVar');
  if (banner){
    banner.className = 'ul-var '+v.kind;
    banner.dataset.kind = v.kind;
    const t = document.getElementById('ulVarText'); if (t) t.textContent = v.text;
    const d = document.getElementById('ulVarDetail'); if (d) d.textContent = v.detail;
  }

function parsePaste(text){
  const lines = String(text||'').replace(/\r/g,'').split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];
  const delim = lines[0].includes('\t') ? '\t' : ',';
  const cells = line => {
    if (delim==='\t') return line.split('\t').map(s => s.trim());
    const out = []; let cur = ''; let q = false;
    for (const ch of line){
      if (ch==='"'){ q = !q; continue; }
      if (ch===',' && !q){ out.push(cur.trim()); cur = ''; continue; }
      cur += ch;
    }
    out.push(cur.trim());
    return out;
  };
  let rows = lines.map(cells);
  const head = rows[0].join(' ').toLowerCase();
  if (/marks|品名|hs|description|ctns/.test(head)) rows = rows.slice(1);
  return rows.map(r => ({
    marks:r[0]||'', name:r[1]||'', desc:r[2]||'', hs:String(r[3]||''),
    ctns:r[4]||'', qty:r[5]||'', nw:r[6]||'', gw:r[7]||'', cbm:r[8]||'', pic:r[9]||''
  })).filter(r => Object.values(r).some(v => String(v).trim()));
}

    const G = GATES[NODES[c.d]?.k];

    if (!missing.length){ advance(c, '异常已解决 · '); return; }
    state.gateOpen = true; toast('异常已关闭 · 还差 '+missing.length+' 项门闩，填齐保存即推进'); render();

  const e = document.querySelector('[data-exc]');

function advance(c, pre){
  const from = c.d, fromN = NODES[c.d].n;
  c.d++; c.v = {}; state.gateOpen = false;
  const counted = markDone(c, from);
  const allClear = counted && todayDone() >= todayTotal();
  let msg;
  if (c.d === N-1) { c.dun = '催款队列 · 刚转入'; msg = (pre||'')+'签收完成 → 已自动转入财务「催款回款」'; }
  else msg = (pre||'')+'「'+fromN+'」门闩齐了 → 推进到「'+NODES[c.d].n+'」';
  toast(allClear ? '今日已清 ✓ 今天的柜都推进完了' : msg + (counted ? progressSuffix() : ''));
  render();
}
