function renderWorkbench(){
  const rows = wbRows();
  const matchCo = c => !state.coFilter || state.coFilter==='全部公司' || c.co===state.coFilter;
  const nDue = DATA.filter(c => isDueToday(c) && matchCo(c)).length;
  const nExc = DATA.filter(c => !!c.exc && isActive(c) && matchCo(c)).length;
  const plats = ['订单平台','清关平台','提柜平台','仓管平台','派送平台','客服平台','财务平台'];
  let body = '';
  if (!rows.length) body = '<div class="wb-empty">这家公司今天没有待处理的柜。</div>';
  plats.forEach(p => {
    const list = rows.filter(c => NODES[c.d] && NODES[c.d].p===p);
    if (!list.length) return;
    body += '<div class="wb-sec">'+p+' <span>'+list.length+'</span></div>';
    list.forEach(c => {
      const td = todayDo(c);
      const cm = cabMeta(c, false);
      body += '<a class="wb-row" href="#/todo/orders/'+c.id+'">'
        + '<span class="cid id">'+c.id+'</span>'
        + '<span class="wb-node">'+NODES[c.d].n+'</span>'
        + '<span class="wb-why">'+td.txt+'</span>'
        + '<span class="wb-side"><span class="wb-co">'+c.co+'</span><span class="cmeta '+cm.cls+'">'+cm.txt+'</span></span>'
        + '</a>';
    });
  });
  $('#detail').innerHTML = '<div class="crumb">工作台</div>'
    + '<div class="dt-hd"><div><h1>今天要处理的</h1>'
    + '<div class="sub"><span>'+state.role+'</span><span class="sep">·</span><span>2026-10-05</span><span class="sep">·</span><span>演示数据</span></div></div></div>'
    + '<p class="wb-lead">按平台分开。点柜号，进入这一柜的操作线。</p>'
    + '<div class="wb-stats">'
    +   '<div class="wb-stat"><span class="k">今日剩</span><span class="v">'+rows.length+'</span></div>'
    +   '<div class="wb-stat due"><span class="k">今日截止</span><span class="v">'+nDue+'</span></div>'
    +   '<div class="wb-stat exc"><span class="k">异常</span><span class="v">'+nExc+'</span></div>'
    + '</div>'
    + '<div class="wb-card">'+body+'</div>'
    + '<div class="scheme-note">完整工作台在旁边那一页（四个岗位的状态维护）。左边「工作台」直接过去。这一页的 #/workbench 只是旧的今日列表。</div>';
  document.title = '工作台 · BBTEX';
}
function render(){
  parseHash();
  $('#app').classList.toggle('page-work', state.page==='workbench');
  renderRing();
  renderNav();
  renderList();
  if (state.page==='workbench') renderWorkbench();
  else { renderDetail(); document.title = '订单平台 · QuickBooks 模式 · BBTEX'; }
  applyCollapsed();
  renderSwitchers();
}
window.addEventListener('hashchange', render);
/* 待办 / 全部：点开就把柜号嵌在这一行下面；再点一下收起。点「订单平台」或 [ 收起整段。 */
document.querySelectorAll('.sub-ni').forEach(a => a.addEventListener('click', (e) => {
  e.preventDefault();
  const v = a.dataset.v;
  if (state.collapsed) {
    toggleCollapsed();
    state.view = v; state.nestOpen = true; state.filter = null; state.gateOpen = false;
    setHash(null); render(); return;
  }
  if (state.view === v) state.nestOpen = !state.nestOpen;
  else { state.view = v; state.nestOpen = true; state.filter = null; state.gateOpen = false; setHash(null); }
  render();
}));
const po = $('#platOrders'); if (po) po.addEventListener('click', (e) => {
  e.preventDefault();
  if (state.page==='workbench'){
    state.collapsed = false; state.nestOpen = true; state.view = 'todo'; state.filter = null;
    try { localStorage.setItem('bbtex13t.collapsed','0'); } catch(err){}
    location.hash = '#/todo';
    return;
  }
  toggleCollapsed(); renderNav();
});
$('#sideTog').addEventListener('click', toggleCollapsed);
$('#ring').addEventListener('click', () => {
  if (state.collapsed) toggleCollapsed();
  state.nestOpen = true;
  state.view = 'todo'; state.filter = todayDone()>=todayTotal() ? null : 'today-work'; if (!state.filter) state.doneFold = false;
  const cur = DATA.find(c => c.id===parseHash());
  setHash(cur && state.filter && FILTERS['today-work'](cur) ? cur.id : null); render();
});
document.addEventListener('click', (e) => {
  if (state.bmenu && !e.target.closest('.list-tools')){ state.bmenu = false; renderList(); }
  if (state.coMenu && !e.target.closest('#coBtn') && !e.target.closest('#coMenu')){ state.coMenu = false; renderSwitchers(); }
  if (state.roleMenu && !e.target.closest('#roleBtn') && !e.target.closest('#roleMenu')){ state.roleMenu = false; renderSwitchers(); }
});
const coBtn = $('#coBtn');
if (coBtn) coBtn.addEventListener('click', (e) => { e.stopPropagation(); state.coMenu = !state.coMenu; state.roleMenu = false; renderSwitchers(); });
const roleBtn = $('#roleBtn');
if (roleBtn) roleBtn.addEventListener('click', (e) => { e.stopPropagation(); state.roleMenu = !state.roleMenu; state.coMenu = false; renderSwitchers(); });
document.addEventListener('keydown', (e) => {
  const qi = $('#q');
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||'');
  if (e.key==='[' && !typing && !e.metaKey && !e.ctrlKey){ e.preventDefault(); toggleCollapsed(); return; }
  if (e.key==='/' && document.activeElement!==qi && !e.metaKey && !e.ctrlKey) {
    e.preventDefault(); if (qi){ qi.focus(); qi.select(); }
  }
});
if (!location.hash || location.hash==='#') location.replace('#/todo');
else if (/todo/.test(location.hash)) state.view = 'todo';
else if (/all/.test(location.hash)) state.view = 'all';
BBTEX.install(typeof DATA!=='undefined'?{page:'order',DATA,GATES,NODES,state,N}:{page:'wb',CABS,FIELDS,GATES,NODES,state});
render();

</script>
</body></html>
